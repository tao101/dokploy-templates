              <return_name>result</return_name>
              <argument>
                  <type>UInt8</type>
                  <name>from_step</name>
              </argument>
              <argument>
                  <type>UInt8</type>
                  <name>to_step</name>
              </argument>
              <argument>
                  <type>UInt8</type>
                  <name>num_steps</name>
              </argument>
              <argument>
                  <type>UInt64</type>
                  <name>conversion_window_limit</name>
              </argument>
              <argument>
                  <type>String</type>
                  <name>breakdown_attribution_type</name>
              </argument>
              <argument>
                  <type>String</type>
                  <name>funnel_order_type</name>
              </argument>
              <argument>
                  <type>Array(Array(String))</type>
                  <name>prop_vals</name>
              </argument>
              <argument>
                  <type>Array(Tuple(Nullable(Float64), UInt64, UUID, Array(String), Array(Int8)))</type>
                  <name>value</name>
              </argument>
              <format>JSONEachRow</format>
              <stderr_reaction>throw</stderr_reaction>
              <command>aggregate_funnel_array_trends_test.py</command>
              <lifetime>600</lifetime>
          </function>
          <function>
              <type>executable</type>
              <name>JSONDropKeys</name>
              <return_type>String</return_type>
              <argument>
                  <type>String</type>
              </argument>
              <format>Raw</format>
              <command>json_drop_keys_udf {keys_parameter:Array(String)}</command>
          </function>
      </functions>

services:
  # ---------------------------------------------------------------------------
  # Edge: Caddy does PostHog's path routing (capture / flags / replay / app).
  # Traefik terminates TLS and forwards plain HTTP here.
  # ---------------------------------------------------------------------------
  proxy:
    image: caddy:2.10-alpine
    container_name: ${CONTAINER_PREFIX}-proxy
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - default
      - dokploy-network
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - capture
      - replay-capture
      - feature-flags
      - hypercache-server
      - livestream
    healthcheck:
      # Caddy's own liveness, not web's — see the @caddy-health block in the Caddyfile.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/-/caddy-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${MEM_PROXY:-192M}
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # One-shot: lifts ClickHouse UDF binaries, protobuf schemas and the GeoIP
  # database out of the PostHog app image, so they always match POSTHOG_APP_TAG.
  # (Upstream hobby git-clones the repo and curls the mmdb instead.)
  # ---------------------------------------------------------------------------
  assets:
    image: posthog/posthog:${POSTHOG_APP_TAG}
    container_name: ${CONTAINER_PREFIX}-assets
    restart: "no"
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        rm -rf /assets/user_scripts /assets/idl
        cp -a /code/posthog/user_scripts /assets/user_scripts
        cp -a /code/posthog/idl /assets/idl
        cp -a /code/posthog/user_scripts/latest_user_defined_function.xml /assets/
        chmod -R a+rX /assets
        cp -a /code/share/GeoLite2-City.mmdb /share/GeoLite2-City.mmdb
        chmod a+r /share/GeoLite2-City.mmdb
        echo "assets ready"
    volumes:
      - posthog-assets:/assets
      - posthog-share:/share
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Data layer
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15.12-alpine
    container_name: ${CONTAINER_PREFIX}-db
    restart: unless-stopped
    command:
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-2GB}
      - -c
      - min_wal_size=512MB
      - -c
      - wal_buffers=16MB
      # NVMe: random reads cost about the same as sequential, and the queue is deep.
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_worker_processes=8
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - default_statistics_target=100
      # Long ClickHouse-side work runs elsewhere; a stuck Postgres statement here
      # is always a bug. Migrations override this themselves.
      - -c
      - idle_in_transaction_session_timeout=300000
    environment:
      POSTGRES_USER: posthog
      POSTGRES_DB: posthog
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog"]
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_DB:-2560M}
    logging: *default-logging

  redis7:
    image: redis:7.2-alpine
    container_name: ${CONTAINER_PREFIX}-redis7
    restart: unless-stopped
    # allkeys-lru matches upstream: PostHog treats this Redis as a cache plus the
    # Celery broker, and relies on eviction rather than OOM under pressure.
    command: >-
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --save 900 1
      --tcp-keepalive 300
    volumes:
      - redis7-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${MEM_REDIS:-768M}
    logging: *default-logging

  # Shadow store the CDP services dual-write to. Data is disposable; every CDP
  # process refuses to start without a CDP_VALKEY_HOST.
  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: ${CONTAINER_PREFIX}-valkey
    restart: unless-stopped
    command: valkey-server --maxmemory ${VALKEY_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${MEM_VALKEY:-384M}
    logging: *default-logging

  # ClickHouse coordination for the ReplicatedMergeTree tables PostHog creates.
  zookeeper:
    image: zookeeper:3.7.0
    container_name: ${CONTAINER_PREFIX}-zookeeper
    restart: unless-stopped
    environment:
      # Default heap is sized off host RAM; pin it so ZK can't claim a GB it never uses.
      JVMFLAGS: "-Xms128m -Xmx${ZK_HEAP:-256m}"
      ZOO_AUTOPURGE_PURGEINTERVAL: 1
      ZOO_AUTOPURGE_SNAPRETAINCOUNT: 3
      ZOO_4LW_COMMANDS_WHITELIST: "srvr,ruok,stat"
    volumes:
      - zookeeper-data:/data
      - zookeeper-datalog:/datalog
      - zookeeper-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 127.0.0.1 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_ZOOKEEPER:-512M}
    logging: *default-logging

  clickhouse:
    image: clickhouse/clickhouse-server:26.6.2.158
    container_name: ${CONTAINER_PREFIX}-clickhouse
    restart: unless-stopped
    depends_on:
      assets:
        condition: service_completed_successfully
      zookeeper:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
      KAFKA_HOSTS: "kafka:9092"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    # The funnel UDF binaries and protobuf format schemas can't live in a compose
    # `config:` (they're multi-MB executables), so they are copied in from the
    # app image on every start — which also keeps them in step across upgrades.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        mkdir -p /var/lib/clickhouse/user_scripts /var/lib/clickhouse/format_schemas
        cp -a /posthog-assets/user_scripts/. /var/lib/clickhouse/user_scripts/
        cp -a /posthog-assets/idl/. /var/lib/clickhouse/format_schemas/
        cp -a /posthog-assets/latest_user_defined_function.xml /etc/clickhouse-server/
        chown -R clickhouse:clickhouse /var/lib/clickhouse/user_scripts /var/lib/clickhouse/format_schemas
        # Upstream's docker-entrypoint-initdb.d/init-db.sh runs SYSTEM FLUSH LOGS on first
        # init so that system.crash_log (and query_log) exist before PostHog's ClickHouse
        # migrations create the custom-metrics views over them. Without it, migration
        # 0159_crash_log_metrics fails with "Unknown table expression identifier
        # 'system.crash_log'" and web restart-loops through the whole migrate step.
        ( until clickhouse-client -q "SELECT 1" >/dev/null 2>&1; do sleep 2; done
          clickhouse-client -q "SYSTEM FLUSH LOGS" && echo "system log tables flushed" ) &
        exec /entrypoint.sh
    configs:
      - source: clickhouse_config
        target: /etc/clickhouse-server/config.xml
      - source: clickhouse_users
        target: /etc/clickhouse-server/users.xml
      - source: clickhouse_cluster
        target: /etc/clickhouse-server/config.d/default.xml
      - source: clickhouse_udf
        target: /etc/clickhouse-server/user_defined_function.xml
      - source: clickhouse_tuning
        target: /etc/clickhouse-server/config.d/zz-cx43.xml
      - source: clickhouse_profile
        target: /etc/clickhouse-server/users.d/zz-cx43.xml
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - posthog-assets:/posthog-assets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${MEM_CLICKHOUSE:-3584M}
    logging: *default-logging

  # Redpanda speaks the Kafka protocol without a JVM or its own ZooKeeper.
  kafka:
    image: docker.io/redpandadata/redpanda:v25.1.9
    container_name: ${CONTAINER_PREFIX}-kafka
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092
      - --advertise-kafka-addr internal://kafka:9092
      - --pandaproxy-addr internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr internal://kafka:8082
      - --schema-registry-addr internal://0.0.0.0:8081
      - --rpc-addr kafka:33145
      - --advertise-rpc-addr kafka:33145
      - --mode dev-container
      # Seastar preallocates --memory up front, so this is a floor as well as a cap.
      - --smp ${RP_SMP:-2}
      - --memory ${RP_MEMORY:-2G}
      - --reserve-memory 0M
      # We share the box with ~30 other containers, so yield instead of busy-polling.
      - --overprovisioned
      - --set redpanda.empty_seed_starts_cluster=false
      - --seeds kafka:33145
      - --set redpanda.auto_create_topics_enabled=true
    environment:
      ALLOW_PLAINTEXT_LISTENER: "true"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9644/v1/status/ready || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${MEM_KAFKA:-2560M}
    logging: *default-logging

  # Creates the topics the ingestion consumers assert at startup, and caps how much
  # disk a stalled consumer can cost us (the box only has 160 GB).
  kafka-init:
    image: docker.io/redpandadata/redpanda:v25.1.9
    container_name: ${CONTAINER_PREFIX}-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -x
        echo "Waiting for Kafka broker to accept connections..."
        TIMEOUT=60; ELAPSED=0
        until rpk topic list --brokers kafka:9092 2>/dev/null; do
            sleep 2; ELAPSED=$$((ELAPSED + 2))
            if [ $$ELAPSED -ge $$TIMEOUT ]; then
                echo "Timeout waiting for Kafka broker after $${TIMEOUT}s"; exit 1
            fi
        done
        # Cluster-wide retention defaults, so auto-created topics are bounded too.
        # `rpk cluster config` talks to the admin API (9644), not the Kafka port.
        rpk cluster config set log_retention_ms ${KAFKA_RETENTION_MS:-86400000} -X admin.hosts=kafka:9644 --no-confirm \
            || echo "WARN: could not set log_retention_ms - auto-created topics keep Redpanda's 7-day default"
        rpk cluster config set retention_bytes ${KAFKA_RETENTION_BYTES:-1073741824} -X admin.hosts=kafka:9644 --no-confirm \
            || echo "WARN: could not set retention_bytes - auto-created topics keep Redpanda's unlimited default"
        TOPICS="clickhouse_events_json \
            clickhouse_ai_events_json \
            clickhouse_heatmap_events \
            clickhouse_flag_evaluations \
            clickhouse_ingestion_warnings \
            events_plugin_ingestion_ai \
            events_plugin_ingestion_dlq \
            events_plugin_ingestion_overflow \
            events_plugin_ingestion_async \
            ingestion-clientwarnings-main-1 \
            heatmaps_ingestion \
            clickhouse_groups \
            clickhouse_person \
            clickhouse_person_distinct_id \
            clickhouse_app_metrics2 \
            log_entries \
            clickhouse_tophog"
        for topic in $$TOPICS; do
            if rpk topic create "$$topic" --brokers kafka:9092 -p 1 -r 1 \
                    -c retention.ms=${KAFKA_RETENTION_MS:-86400000} \
                    -c retention.bytes=${KAFKA_RETENTION_BYTES:-1073741824} 2>&1; then
                echo "Topic $$topic created"
            elif rpk topic list --brokers kafka:9092 | grep -q "$$topic"; then
                echo "Topic $$topic already exists, continuing"
            else
                echo "Failed to create topic $$topic"; exit 1
            fi
        done
        rpk topic list --brokers kafka:9092
        echo "Topics ready"
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging

  # S3-compatible store for exports, AI blobs and the DuckLake staging bucket.
  objectstorage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ${CONTAINER_PREFIX}-objectstorage
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    entrypoint: sh
    command: -c 'mkdir -p /data/posthog /data/ducklake-dev /data/ai-blobs && minio server --address ":19000" --console-address ":19001" /data'
    volumes:
      - objectstorage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:19000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_OBJECTSTORAGE:-512M}
    logging: *default-logging

  # Blob store for session replay v2 snapshots — the fastest-growing data on disk.
  seaweedfs:
    image: chrislusf/seaweedfs:4.29
    container_name: ${CONTAINER_PREFIX}-seaweedfs
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        /usr/bin/weed "$$@" &
        WEED_PID=$$!
        echo "Waiting for SeaweedFS to initialize..."
        while true; do
            sleep 5
            if echo "s3.bucket.list" | /usr/bin/weed shell -master=localhost:9333 2>&1 | grep -q "posthog"; then
                echo "Bucket posthog exists!"; break
            fi
            echo "s3.bucket.create -name posthog" | /usr/bin/weed shell -master=localhost:9333 2>&1 || true
        done
        echo "SeaweedFS ready with posthog bucket"
        wait $$WEED_PID
      - --
    command: ["server", "-s3", "-s3.port=8333", "-dir=/data", "-volume.max=1000", "-master.volumePreallocate=false"]
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "echo 's3.bucket.list' | /usr/bin/weed shell -master=localhost:9333 2>&1 | grep -q posthog"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_SEAWEEDFS:-768M}
    logging: *default-logging

  # Durable workflow engine behind batch exports and scheduled alerts.
  # ENABLE_ES=false keeps visibility in Postgres, so no Elasticsearch container.
  temporal:
    image: temporalio/auto-setup:1.26.2
    container_name: ${CONTAINER_PREFIX}-temporal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: posthog
      POSTGRES_PWD: "${POSTGRES_PASSWORD}"
      POSTGRES_SEEDS: db
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      ENABLE_ES: "false"
    configs:
      - source: temporal_dynamicconfig
        target: /etc/temporal/config/dynamicconfig/development-sql.yaml
    healthcheck:
      # Temporal binds its container IP, not loopback — 127.0.0.1 never answers.
      test: ["CMD-SHELL", "nc -z $$(hostname) 7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: ${MEM_TEMPORAL:-768M}
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # PostHog application (Django)
  # ---------------------------------------------------------------------------
  web:
    image: posthog/posthog:${POSTHOG_APP_TAG}
    container_name: ${CONTAINER_PREFIX}-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      objectstorage:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      personhog-router:
        condition: service_started
    # Upstream's compose/start script, inlined: wait for the stores, migrate, serve.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until (echo > /dev/tcp/clickhouse/9000) 2>/dev/null; do echo "waiting for clickhouse"; sleep 5; done
        until (echo > /dev/tcp/db/5432) 2>/dev/null; do echo "waiting for postgres"; sleep 5; done
        ./bin/migrate
        exec ./bin/docker-server
    expose:
      - "8000"
    environment:
      <<: *posthog-app-env
      LIVESTREAM_HOST: "https://${POSTHOG_DOMAIN}/livestream"
      OTEL_SERVICE_NAME: posthog
      SESSION_RECORDING_V2_S3_ENABLED: "${SESSION_RECORDING_V2_S3_ENABLED:-True}"
      # Each Unit process is a full Django interpreter (~1 GB resident on 2026
      # master). 3 is the sweet spot on 16 GB; raise it only if the UI feels
      # serialised under load, and raise MEM_WEB with it.
      NGINX_UNIT_APP_PROCESSES: "${WEB_PROCESSES:-3}"
      NGINX_UNIT_REQUEST_LIMIT: "${WEB_REQUEST_LIMIT:-7500}"
    healthcheck:
      test:
        - CMD-SHELL
        - "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/_health', timeout=5).status==200 else 1)\""
      interval: 30s
      timeout: 10s
      retries: 5
      # First boot runs the full Postgres + ClickHouse migration set. Measured on a
      # CX43 in Sep 2026: ~50 minutes, almost all of it Django's single-threaded
      # planning of ~2,700 migrations on a shared 2 GHz core. Give it an hour.
      start_period: 3600s
    deploy:
      resources:
        limits:
          memory: ${MEM_WEB:-3072M}
    logging: *default-logging

  worker:
    image: posthog/posthog:${POSTHOG_APP_TAG}
    container_name: ${CONTAINER_PREFIX}-worker
    restart: unless-stopped
    command: ["./bin/docker-worker-celery", "--with-scheduler"]
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      kafka:
        condition: service_healthy
      personhog-router:
        condition: service_started
      browserless:
        condition: service_started
    environment:
      <<: *posthog-app-env
      POSTHOG_SKIP_MIGRATION_CHECKS: "1"
      SESSION_RECORDING_V2_S3_ENABLED: "${SESSION_RECORDING_V2_S3_ENABLED:-True}"
      # Celery forks one full Django process per worker and defaults to one per
      # vCPU — 8 of them would not fit. Recycle children to cap leak growth.
      WEB_CONCURRENCY: "${CELERY_CONCURRENCY:-2}"
      CELERY_MAX_TASKS_PER_CHILD: "${CELERY_MAX_TASKS_PER_CHILD:-200}"
      CELERY_MAX_MEMORY_PER_CHILD: "${CELERY_MAX_MEMORY_PER_CHILD:-400000}"
      CELERY_WORKER_PREFETCH_MULTIPLIER: "${CELERY_PREFETCH:-1}"
    deploy:
      resources:
        limits:
          memory: ${MEM_WORKER:-2560M}
    logging: *default-logging

  temporal-django-worker:
    image: posthog/posthog:${POSTHOG_APP_TAG}
    container_name: ${CONTAINER_PREFIX}-temporal-django-worker
    restart: unless-stopped
    command: ["./bin/temporal-django-worker"]
    depends_on:
      web:
        condition: service_started
      temporal:
        condition: service_healthy
    environment:
      <<: *posthog-app-env
      TEMPORAL_HOST: temporal
      POSTHOG_SKIP_MIGRATION_CHECKS: "1"
      SESSION_RECORDING_V2_S3_ENABLED: "${SESSION_RECORDING_V2_S3_ENABLED:-True}"
    deploy:
      resources:
        limits:
          memory: ${MEM_TEMPORAL_WORKER:-1536M}
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Plugin server (Node) — one container per consumer role
  # ---------------------------------------------------------------------------
  # CDP: destinations, hog functions, public webhooks.
  plugins:
    image: posthog/posthog-node:${POSTHOG_NODE_TAG}
    container_name: ${CONTAINER_PREFIX}-plugins
    restart: unless-stopped
    command: ["node", "nodejs/dist/index.js"]
    depends_on:
      assets:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      valkey:
        condition: service_healthy
      kafka:
        condition: service_healthy
      objectstorage:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      <<: *plugin-server-env
      NODE_OPTIONS: "--max-old-space-size=${NODE_HEAP_PLUGINS:-448}"
      SITE_URL: "https://${POSTHOG_DOMAIN}"
      SECRET_KEY: "${POSTHOG_SECRET}"
      OBJECT_STORAGE_ENABLED: "true"
      OBJECT_STORAGE_ENDPOINT: "http://objectstorage:19000"
      OBJECT_STORAGE_PUBLIC_ENDPOINT: "https://${POSTHOG_DOMAIN}"
      OBJECT_STORAGE_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      CDP_REDIS_HOST: redis7
      CDP_REDIS_PORT: "6379"
      LOGS_REDIS_HOST: redis7
      LOGS_REDIS_PORT: "6379"
      LOGS_REDIS_TLS: "false"
      TRACES_REDIS_HOST: redis7
      TRACES_REDIS_PORT: "6379"
      TRACES_REDIS_TLS: "false"
      # Every CDP process dual-writes to Valkey and refuses to start without a host.
      CDP_VALKEY_HOST: valkey
      CDP_VALKEY_PORT: "6379"
    volumes:
      - posthog-share:/share:ro
    deploy:
      resources:
        limits:
          memory: ${MEM_PLUGINS:-768M}
    logging: *default-logging

  # The main analytics ingestion pipeline: events -> persons -> ClickHouse.
  ingestion-general:
    image: posthog/posthog-node:${POSTHOG_NODE_TAG}
    container_name: ${CONTAINER_PREFIX}-ingestion-general
    restart: unless-stopped
    command: ["node", "nodejs/dist/index.js"]
    depends_on:
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      objectstorage:
        condition: service_healthy
      personhog-router:
        condition: service_started
    environment:
      <<: *plugin-server-env
      NODE_OPTIONS: "--max-old-space-size=${NODE_HEAP_INGESTION:-640}"
      PLUGIN_SERVER_MODE: ingestion-v2-combined
      COOKIELESS_REDIS_HOST: redis7
      COOKIELESS_REDIS_PORT: "6379"
      CDP_REDIS_HOST: redis7
      PERSONHOG_ADDR: "personhog-router:50052"
      PERSONHOG_ENABLED: "true"
      # Combined mode owns AI blob offload; without a bucket, multimodal payloads
      # get inlined into the event instead of stored as phaiblob:// pointers.
      AI_BLOB_S3_BUCKET: ai-blobs
      AI_BLOB_S3_PREFIX: "aio/"
      AI_BLOB_S3_ENDPOINT: "http://objectstorage:19000"
      AI_BLOB_S3_REGION: us-east-1
      AI_BLOB_S3_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      AI_BLOB_S3_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      AI_BLOB_OFFLOAD_TEAMS: "*"
    deploy:
      resources:
        limits:
          memory: ${MEM_INGESTION:-1024M}
    logging: *default-logging

  ingestion-sessionreplay:
    image: posthog/posthog-node:${POSTHOG_NODE_TAG}
    container_name: ${CONTAINER_PREFIX}-ingestion-sessionreplay
    restart: unless-stopped
    command: ["node", "nodejs/dist/index.js"]
    depends_on:
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      kafka:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      <<: *plugin-server-env
      NODE_OPTIONS: "--max-old-space-size=${NODE_HEAP_REPLAY:-448}"
      PLUGIN_SERVER_MODE: recordings-blob-ingestion-v2
      SESSION_RECORDING_V2_S3_ENDPOINT: "http://seaweedfs:8333"
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: "any"
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: "any"
      SESSION_RECORDING_V2_S3_TIMEOUT_MS: "120000"
    deploy:
      resources:
        limits:
          memory: ${MEM_INGESTION_REPLAY:-768M}
    logging: *default-logging

  recording-api:
    image: posthog/posthog-node:${POSTHOG_NODE_TAG}
    container_name: ${CONTAINER_PREFIX}-recording-api
    restart: unless-stopped
    command: ["node", "nodejs/dist/index.js"]
    depends_on:
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      <<: *plugin-server-env
      NODE_OPTIONS: "--max-old-space-size=${NODE_HEAP_SMALL:-320}"
      PLUGIN_SERVER_MODE: recording-api
      SESSION_RECORDING_API_REDIS_HOST: redis7
      SESSION_RECORDING_API_REDIS_PORT: "6379"
      # Read side of the replay v2 blob store. Must match what ingestion-sessionreplay
      # writes to; without these it falls back to localhost:8333 and every playback 500s.
      SESSION_RECORDING_V2_S3_ENDPOINT: "http://seaweedfs:8333"
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: "any"
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: "any"
      # web and worker send this as X-Internal-Api-Secret.
      INTERNAL_API_SECRET: "${POSTHOG_SECRET}"
    deploy:
      resources:
        limits:
          memory: ${MEM_NODE_SMALL:-512M}
    logging: *default-logging

  ingestion-error-tracking:
    image: posthog/posthog-node:${POSTHOG_NODE_TAG}
    container_name: ${CONTAINER_PREFIX}-ingestion-error-tracking
    restart: unless-stopped
    command: ["node", "nodejs/dist/index.js"]
    depends_on:
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *plugin-server-env
      NODE_OPTIONS: "--max-old-space-size=${NODE_HEAP_SMALL:-320}"
      PLUGIN_SERVER_MODE: ingestion-errortracking
      CDP_REDIS_HOST: redis7
      ERROR_TRACKING_CYMBAL_BASE_URL: "http://cymbal:3302"
    deploy:
      resources:
        limits:
          memory: ${MEM_NODE_SMALL:-512M}
    logging: *default-logging

  ingestion-logs:
    image: posthog/posthog-node:${POSTHOG_NODE_TAG}
    container_name: ${CONTAINER_PREFIX}-ingestion-logs
    restart: unless-stopped
    command: ["node", "nodejs/dist/index.js"]
    depends_on:
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *plugin-server-env
      NODE_OPTIONS: "--max-old-space-size=${NODE_HEAP_SMALL:-320}"
      PLUGIN_SERVER_MODE: ingestion-logs
      LOGS_REDIS_HOST: redis7
      LOGS_REDIS_TLS: "false"
      CDP_REDIS_HOST: redis7
    deploy:
      resources:
        limits:
          memory: ${MEM_NODE_SMALL:-512M}
    logging: *default-logging

  ingestion-traces:
    image: posthog/posthog-node:${POSTHOG_NODE_TAG}
    container_name: ${CONTAINER_PREFIX}-ingestion-traces
    restart: unless-stopped
    command: ["node", "nodejs/dist/index.js"]
    depends_on:
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *plugin-server-env
      NODE_OPTIONS: "--max-old-space-size=${NODE_HEAP_SMALL:-320}"
      PLUGIN_SERVER_MODE: ingestion-traces
      TRACES_REDIS_HOST: redis7
      TRACES_REDIS_TLS: "false"
    deploy:
      resources:
        limits:
          memory: ${MEM_NODE_SMALL:-512M}
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Rust / Go edge services
  # ---------------------------------------------------------------------------
  capture:
    image: ghcr.io/posthog/posthog/capture:${CAPTURE_TAG:-${POSTHOG_GHCR_TAG}}
    container_name: ${CONTAINER_PREFIX}-capture
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis7:
        condition: service_healthy
    environment:
      ADDRESS: "0.0.0.0:3000"
      CAPTURE_MODE: events
      KAFKA_TOPIC: events_plugin_ingestion
      KAFKA_ERROR_TRACKING_TOPIC: ingestion-errortracking-main
      KAFKA_HOSTS: "kafka:9092"
      REDIS_URL: "redis://redis7:6379/"
      RUST_LOG: "info,rdkafka=warn"
      CAPTURE_V1_SINKS: msk
      CAPTURE_V1_SINK_MSK_KAFKA_HOSTS: "kafka:9092"
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_MAIN: events_plugin_ingestion
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_HISTORICAL: events_plugin_ingestion_historical
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_OVERFLOW: events_plugin_ingestion_overflow
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_DLQ: events_plugin_ingestion_dlq
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_EXCEPTION: ingestion-errortracking-main
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_HEATMAP: heatmaps_ingestion
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_CLIENT_INGESTION_WARNING: ingestion-clientwarnings-main-1
    deploy:
      resources:
        limits:
          memory: ${MEM_CAPTURE:-320M}
    logging: *default-logging

  # Upstream hobby routes /i/v0/ai to a capture-ai service it never defines, so
  # LLM-analytics ingestion 502s there. Same image, ~60 MB, wired up here.
  capture-ai:
    image: ghcr.io/posthog/posthog/capture:${CAPTURE_TAG:-${POSTHOG_GHCR_TAG}}
    container_name: ${CONTAINER_PREFIX}-capture-ai
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis7:
        condition: service_healthy
    environment:
      ADDRESS: "0.0.0.0:3000"
      CAPTURE_MODE: ai
      KAFKA_TOPIC: events_plugin_ingestion_ai
      KAFKA_HOSTS: "kafka:9092"
      REDIS_URL: "redis://redis7:6379/"
      RUST_LOG: "info,rdkafka=warn"
    deploy:
      resources:
        limits:
          memory: ${MEM_CAPTURE:-320M}
    logging: *default-logging

  replay-capture:
    image: ghcr.io/posthog/posthog/capture:${CAPTURE_TAG:-${POSTHOG_GHCR_TAG}}
    container_name: ${CONTAINER_PREFIX}-replay-capture
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis7:
        condition: service_healthy
    environment:
      ADDRESS: "0.0.0.0:3000"
      CAPTURE_MODE: recordings
      KAFKA_TOPIC: session_recording_snapshot_item_events
      KAFKA_HOSTS: "kafka:9092"
      REDIS_URL: "redis://redis7:6379/"
      RUST_LOG: "info,rdkafka=warn"
    deploy:
      resources:
        limits:
          memory: ${MEM_CAPTURE:-320M}
    logging: *default-logging

  capture-logs:
    image: ghcr.io/posthog/posthog/capture-logs:${CAPTURE_LOGS_TAG:-${POSTHOG_GHCR_TAG}}
    container_name: ${CONTAINER_PREFIX}-capture-logs
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "4318"
      RUST_LOG: "info,rdkafka=warn"
      KAFKA_HOSTS: "kafka:9092"
      KAFKA_TOPIC: logs_ingestion
      KAFKA_METRICS_TOPIC: metrics_ingestion
      JWT_SECRET: "${POSTHOG_SECRET}"
    deploy:
      resources:
        limits:
          memory: ${MEM_CAPTURE:-320M}
    logging: *default-logging

  property-defs-rs:
    image: ghcr.io/posthog/posthog/property-defs-rs:${PROPERTY_DEFS_TAG:-${POSTHOG_GHCR_TAG}}
    container_name: ${CONTAINER_PREFIX}-property-defs-rs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog"
      KAFKA_HOSTS: "kafka:9092"
      SKIP_WRITES: "false"
      SKIP_READS: "false"
      FILTER_MODE: opt-out
      RUST_LOG: info
    deploy:
      resources:
        limits:
          memory: ${MEM_RUST:-384M}
    logging: *default-logging

  feature-flags:
    image: ghcr.io/posthog/posthog/feature-flags:${FEATURE_FLAGS_TAG:-${POSTHOG_GHCR_TAG}}
    container_name: ${CONTAINER_PREFIX}-feature-flags
    restart: unless-stopped
    depends_on:
      assets:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
    environment:
      ADDRESS: "0.0.0.0:3001"
      WRITE_DATABASE_URL: "postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog"
      READ_DATABASE_URL: "postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog"
      PERSONS_WRITE_DATABASE_URL: "postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog"
      PERSONS_READ_DATABASE_URL: "postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog"
      MAXMIND_DB_PATH: "/share/GeoLite2-City.mmdb"
      REDIS_URL: "redis://redis7:6379/"
      COOKIELESS_REDIS_HOST: redis7
      COOKIELESS_REDIS_PORT: "6379"
      RUST_LOG: info
    volumes:
      - posthog-share:/share:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/_readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_RUST:-384M}
    logging: *default-logging

  # Serves /surveys and /array/* (remote config) straight from Redis.
  hypercache-server:
    image: ghcr.io/posthog/posthog/hypercache-server:${HYPERCACHE_TAG:-${POSTHOG_GHCR_TAG}}
    container_name: ${CONTAINER_PREFIX}-hypercache-server
    restart: unless-stopped
    depends_on:
      redis7:
        condition: service_healthy
    environment:
      ADDRESS: "0.0.0.0:3002"
      REDIS_URL: "redis://redis7:6379/"
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/_readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_RUST_SMALL:-256M}
    logging: *default-logging

  personhog-replica:
    image: ghcr.io/posthog/posthog/personhog-replica:${PERSONHOG_TAG:-${POSTHOG_GHCR_TAG}}
    container_name: ${CONTAINER_PREFIX}-personhog-replica
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GRPC_ADDRESS: "0.0.0.0:50051"
      PRIMARY_DATABASE_URL: "postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog"
      METRICS_PORT: "9100"
      RUST_LOG: info
    deploy:
      resources:
        limits:
          memory: ${MEM_RUST:-384M}
    logging: *default-logging

  personhog-router:
    image: ghcr.io/posthog/posthog/personhog-router:${PERSONHOG_TAG:-${POSTHOG_GHCR_TAG}}
    container_name: ${CONTAINER_PREFIX}-personhog-router
    restart: unless-stopped
    depends_on:
      - personhog-replica
    environment:
      GRPC_ADDRESS: "0.0.0.0:50052"
      REPLICA_URL: "http://personhog-replica:50051"
      BACKEND_TIMEOUT_MS: "5000"
      METRICS_PORT: "9101"
      RUST_LOG: info
    deploy:
      resources:
        limits:
          memory: ${MEM_RUST_SMALL:-256M}
    logging: *default-logging

  # Error-tracking stack trace processing; delegates symbol resolution over gRPC.
  cymbal:
    image: ghcr.io/posthog/posthog/cymbal:${CYMBAL_TAG:-${POSTHOG_GHCR_TAG}}
    container_name: ${CONTAINER_PREFIX}-cymbal
    restart: unless-stopped
    depends_on:
      assets:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      cymbal-resolution:
        condition: service_started
    environment:
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "3302"
      KAFKA_HOSTS: "kafka:9092"
      OBJECT_STORAGE_BUCKET: posthog
      OBJECT_STORAGE_ACCESS_KEY_ID: "any"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "any"
      OBJECT_STORAGE_ENDPOINT: "http://seaweedfs:8333"
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      DATABASE_URL: "postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog"
      PERSONS_URL: "postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog"
      MAXMIND_DB_PATH: "/share/GeoLite2-City.mmdb"
      REDIS_URL: "redis://redis7:6379/"
      ISSUE_BUCKETS_REDIS_URL: "redis://redis7:6379/"
      CYMBAL_REMOTE_RESOLUTION_HOST: cymbal-resolution
      INTERNAL_API_SECRET: "${POSTHOG_SECRET}"
      RUST_LOG: info
    volumes:
      - posthog-share:/share:ro
    deploy:
      resources:
        limits:
          memory: ${MEM_CYMBAL:-512M}
    logging: *default-logging

  cymbal-resolution:
    image: ghcr.io/posthog/posthog/cymbal:${CYMBAL_TAG:-${POSTHOG_GHCR_TAG}}
    container_name: ${CONTAINER_PREFIX}-cymbal-resolution
    restart: unless-stopped
    depends_on:
      seaweedfs:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      CYMBAL_MODE: resolution
      GRPC_ADDRESS: "0.0.0.0:50061"
      OBJECT_STORAGE_BUCKET: posthog
      OBJECT_STORAGE_ACCESS_KEY_ID: "any"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "any"
      OBJECT_STORAGE_ENDPOINT: "http://seaweedfs:8333"
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      DATABASE_URL: "postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog"
      INTERNAL_API_SECRET: "${POSTHOG_SECRET}"
      RUST_LOG: info
    deploy:
      resources:
        limits:
          memory: ${MEM_CYMBAL:-512M}
    logging: *default-logging

  # Powers the live events feed in the UI.
  livestream:
    image: ghcr.io/posthog/posthog/livestream:${LIVESTREAM_TAG:-${POSTHOG_GHCR_TAG}}
    container_name: ${CONTAINER_PREFIX}-livestream
    restart: unless-stopped
    depends_on:
      assets:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      LIVESTREAM_JWT_SECRET: "${POSTHOG_SECRET}"
    configs:
      - source: livestream_config
        target: /configs/configs.yml
    volumes:
      - posthog-share:/share:ro
    deploy:
      resources:
        limits:
          memory: ${MEM_LIVESTREAM:-384M}
    logging: *default-logging

  # Headless Chromium for image exports and heatmap screenshots — no browser
  # ships in the PostHog image. Safe to comment out if you never export images.
  browserless:
    image: ghcr.io/browserless/chromium:v2.51.2
    container_name: ${CONTAINER_PREFIX}-browserless
    restart: unless-stopped
    environment:
      TOKEN: "${BROWSERLESS_SECRET}"
      CONCURRENT: "${BROWSERLESS_CONCURRENT:-2}"
      TIMEOUT: "${BROWSERLESS_TIMEOUT:-60000}"
    deploy:
      resources:
        limits:
          memory: ${MEM_BROWSERLESS:-1024M}
    logging: *default-logging

volumes:
  postgres-data:
  redis7-data:
  clickhouse-data:
  clickhouse-logs:
  zookeeper-data:
  zookeeper-datalog:
  zookeeper-logs:
  redpanda-data:
  objectstorage-data:
  seaweedfs-data:
  posthog-assets:
  posthog-share:
  caddy-data:
  caddy-config:

networks:
  dokploy-network:
    external: true
