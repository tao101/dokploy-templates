# PostHog (self-hosted) for Dokploy — tuned for Hetzner CX43 (8 vCPU / 16 GB / 160 GB NVMe)
# =========================================================================================
# Standalone template: paste this compose + posthog.env into Dokploy and deploy.
# Every config file is embedded inline via Docker Compose `configs:` — no file mounts needed.
#
# Derived from PostHog's official hobby stack:
#   https://github.com/PostHog/posthog/blob/master/docker-compose.hobby.yml
#   https://github.com/PostHog/posthog/blob/master/docker-compose.base.yml
# with `extends:` flattened, `build:` removed, host port publishing removed, TLS delegated
# to Dokploy's Traefik, and every memory-hungry default resized for a 16 GB box.
#
# Deliberate differences from upstream hobby — see DEPLOY-GUIDE.md "What differs from upstream":
#   - Caddy terminates plain HTTP on :80 behind Traefik instead of owning 80/443 + ACME
#   - elasticsearch / temporal-ui / temporal-admin-tools / asyncmigrationscheck dropped
#   - capture-ai added (upstream hobby routes /i/v0/ai to a service it never defines)
#   - Postgres and MinIO credentials are generated, not the published `posthog:posthog` defaults
#   - explicit memory limits on every service, and ClickHouse / Redpanda / Postgres / Celery /
#     Nginx Unit / Node heaps sized for 16 GB instead of a 64 GB+ machine
#
# Domain setup (after first deploy):
#   Dokploy UI -> compose service -> Domains -> Add Domain
#     Domain: posthog.yourdomain.com   Service: proxy   Container Port: 80   HTTPS: on
#   Then set POSTHOG_DOMAIN in the env to the same host and redeploy.

name: posthog

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

# Everything the Django/Celery/Temporal containers need to reach the data layer.
# Upstream loads these from the repo's .env.services; inlined here so the template stays standalone.
x-posthog-services-env: &posthog-services-env
  DATABASE_URL: "postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog"
  PGHOST: db
  PGUSER: posthog
  PGPASSWORD: "${POSTGRES_PASSWORD}"
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_DATABASE: posthog
  CLICKHOUSE_SECURE: "false"
  CLICKHOUSE_VERIFY: "false"
  CLICKHOUSE_API_USER: api
  CLICKHOUSE_API_PASSWORD: apipass
  CLICKHOUSE_APP_USER: app
  CLICKHOUSE_APP_PASSWORD: apppass
  CLICKHOUSE_BILLING_USER: billing
  CLICKHOUSE_BILLING_PASSWORD: billingpass
  CLICKHOUSE_DICT_READER_USER: dict_reader
  CLICKHOUSE_DICT_READER_PASSWORD: dictreaderpass
  REDIS_URL: "redis://redis7:6379/"
  KAFKA_HOSTS: "kafka:9092"
  OBJECT_STORAGE_ENDPOINT: "http://objectstorage:19000"
  OBJECT_STORAGE_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
  OBJECT_STORAGE_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
  OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
  # Traefik terminates TLS and Caddy forwards plain HTTP, so Django must trust the
  # proxy headers and must not bounce requests to https:// (that would loop).
  IS_BEHIND_PROXY: "true"
  DISABLE_SECURE_SSL_REDIRECT: "true"

# Shared by web, worker and temporal-django-worker (upstream's `worker` anchor).
x-posthog-app-env: &posthog-app-env
  <<: *posthog-services-env
  SITE_URL: "https://${POSTHOG_DOMAIN}"
  SECRET_KEY: "${POSTHOG_SECRET}"
  ENCRYPTION_SALT_KEYS: "${ENCRYPTION_SALT_KEYS}"
  INTERNAL_API_SECRET: "${POSTHOG_SECRET}"
  DEPLOYMENT: hobby
  OTEL_SDK_DISABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  API_QUERIES_PER_TEAM: '{"1": 100}'
  CDP_API_URL: "http://plugins:6738"
  FLAGS_REDIS_ENABLED: "false"
  # Hobby keeps persons in the main posthog database, so both point at it.
  PERSONS_DB_WRITER_URL: "postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog"
  PERSONS_DB_READER_URL: "postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog"
  RECORDING_API_URL: "http://recording-api:6738"
  OBJECT_STORAGE_ENABLED: "true"
  OBJECT_STORAGE_PUBLIC_ENDPOINT: "https://${POSTHOG_DOMAIN}"
  SESSION_RECORDING_V2_S3_ENDPOINT: "http://seaweedfs:8333"
  SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: "any"
  SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: "any"
  PERSONHOG_ADDR: "personhog-router:50052"
  PERSONHOG_ENABLED: "true"
  FEATURE_FLAGS_SERVICE_URL: "http://feature-flags:3001"
  # The logs product uses a dedicated ClickHouse cluster config that defaults to
  # localhost + TLS outside DEBUG. Point it at this stack's ClickHouse over plaintext.
  CLICKHOUSE_LOGS_CLUSTER_HOST: clickhouse
  CLICKHOUSE_LOGS_CLUSTER_SECURE: "false"
  BROWSERLESS_CDP_URL: "ws://browserless:3000"
  BROWSERLESS_TOKEN: "${BROWSERLESS_SECRET}"
  HEATMAP_BROWSERLESS_URL: "http://browserless:3000"
  HEATMAP_BROWSERLESS_TOKEN: "${BROWSERLESS_SECRET}"
  # Anonymous usage telemetry back to PostHog Cloud. Set OPT_OUT_CAPTURE=1 to disable.
  OPT_OUT_CAPTURE: "${OPT_OUT_CAPTURE:-0}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  EMAIL_ENABLED: "${EMAIL_ENABLED:-False}"
  EMAIL_HOST: "${EMAIL_HOST:-}"
  EMAIL_PORT: "${EMAIL_PORT:-25}"
  EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
  EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
  EMAIL_USE_TLS: "${EMAIL_USE_TLS:-True}"
  EMAIL_USE_SSL: "${EMAIL_USE_SSL:-False}"
  EMAIL_DEFAULT_FROM: "${EMAIL_DEFAULT_FROM:-}"

# Shared by every plugin-server (Node) container.
x-plugin-server-env: &plugin-server-env
  DATABASE_URL: "postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog"
  PERSONS_DATABASE_URL: "postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog"
  BEHAVIORAL_COHORTS_DATABASE_URL: "postgres://posthog:${POSTGRES_PASSWORD}@db:5432/posthog"
  KAFKA_HOSTS: "kafka:9092"
  REDIS_URL: "redis://redis7:6379/"
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_DATABASE: posthog
  CLICKHOUSE_SECURE: "false"
  CLICKHOUSE_VERIFY: "false"
  ENCRYPTION_SALT_KEYS: "${ENCRYPTION_SALT_KEYS}"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

configs:
  # Path routing for PostHog's split ingestion endpoints. Traefik terminates TLS
  # and forwards here on plain HTTP, so Caddy listens on :80 with auto_https off.
  # X-Forwarded-For is passed through untouched so the app sees the real client IP
  # (Traefik already set it) instead of Caddy appending Traefik's container IP.
  caddyfile:
    content: |
      {
          admin off
          auto_https off
          servers {
              trusted_proxies static private_ranges
          }
      }

      (fwd) {
          header_up X-Forwarded-For {http.request.header.X-Forwarded-For}
      }

      :80 {
          # Local-only liveness endpoint for the container healthcheck. Deliberately does
          # NOT go through web: Traefik drops any container whose healthcheck fails, so a
          # proxy health tied to web turns every web restart (migrate-on-start, ~5-10 min
          # per redeploy) into a Traefik 404 instead of a Caddy 502.
          @caddy-health {
              path /-/caddy-health
              remote_ip 127.0.0.1 ::1
          }
          handle @caddy-health {
              respond "ok" 200
          }

          @replay-capture path /s /s/ /s/*
          @capture-ai path /i/v0/ai /i/v0/ai/ /i/v0/ai/*
          @capture path /e /e/ /e/* /i/v0 /i/v0/ /i/v0/* /i/v1/analytics/events /i/v1/analytics/events/ /batch /batch/ /batch/* /capture /capture/ /capture/*
          @capture-logs path /i/v1/logs /i/v1/logs/ /i/v1/logs/* /i/v1/traces /i/v1/traces/ /i/v1/traces/* /i/v1/metrics /i/v1/metrics/ /i/v1/metrics/*
          @flags path /flags /flags/ /flags/* /api/feature_flag/local_evaluation /api/feature_flag/local_evaluation/ /api/feature_flag/local_evaluation/*
          @surveys path /surveys /surveys/ /api/surveys /api/surveys/
          @remote-config path /array/*
          @webhooks path /public/webhooks /public/webhooks/ /public/webhooks/* /public/m/ /public/m/*
          @livestream path /livestream /livestream/ /livestream/*
          @objectstorage path /posthog /posthog/ /posthog/*

          handle @livestream {
              uri strip_prefix /livestream
              reverse_proxy livestream:8080 {
                  import fwd
                  flush_interval -1
              }
          }
          handle @capture-ai {
              reverse_proxy capture-ai:3000 {
                  import fwd
              }
          }
          handle @capture {
              reverse_proxy capture:3000 {
                  import fwd
              }
          }
          handle @replay-capture {
              reverse_proxy replay-capture:3000 {
                  import fwd
              }
          }
          handle @capture-logs {
              reverse_proxy capture-logs:4318 {
                  import fwd
              }
          }
          handle @flags {
              reverse_proxy feature-flags:3001 {
                  import fwd
              }
          }
          handle @surveys {
              reverse_proxy hypercache-server:3002 {
                  import fwd
              }
          }
          handle @remote-config {
              reverse_proxy hypercache-server:3002 {
                  import fwd
              }
          }
          handle @webhooks {
              reverse_proxy plugins:6738 {
                  import fwd
              }
          }
          handle @objectstorage {
              reverse_proxy objectstorage:19000
          }
          handle {
              reverse_proxy web:8000 {
                  import fwd
              }
          }
      }

  # CX43 sizing overlay. Loaded after config.xml (config.d/, "zz-" sorts last), so
  # these win over PostHog's upstream values, which assume a much larger machine.
  clickhouse_tuning:
    content: |
      <clickhouse>
          <!-- Upstream leaves this to max_server_memory_usage_to_ram_ratio (0.9).
               Pin it so ClickHouse budgets against its share of the box, not the box. -->
          <max_server_memory_usage>${CH_MAX_SERVER_MEMORY:-2415919104}</max_server_memory_usage>
          <!-- Upstream: 5 GiB mark cache, 8 GiB uncompressed cache. -->
          <mark_cache_size>${CH_MARK_CACHE:-536870912}</mark_cache_size>
          <uncompressed_cache_size>${CH_UNCOMPRESSED_CACHE:-134217728}</uncompressed_cache_size>
          <!-- Upstream: 200 concurrent queries / 10000 threads, sized for a query cluster. -->
          <max_concurrent_queries>${CH_MAX_CONCURRENT_QUERIES:-40}</max_concurrent_queries>
          <max_thread_pool_size>${CH_MAX_THREAD_POOL:-2000}</max_thread_pool_size>
          <concurrent_threads_soft_limit_num>${CH_THREADS_SOFT_LIMIT:-8}</concurrent_threads_soft_limit_num>
          <max_connections>512</max_connections>
          <!-- System log tables are the classic way a small ClickHouse disk fills up.
               Keep query_log (short TTL) for debugging; drop the per-second ones. -->
          <query_log>
              <flush_interval_milliseconds>7500</flush_interval_milliseconds>
              <ttl>event_date + INTERVAL ${CH_QUERY_LOG_TTL_DAYS:-3} DAY</ttl>
          </query_log>
          <query_thread_log remove="1"/>
          <query_views_log remove="1"/>
          <text_log remove="1"/>
          <trace_log remove="1"/>
          <metric_log remove="1"/>
          <query_metric_log remove="1"/>
          <asynchronous_metric_log remove="1"/>
          <asynchronous_insert_log remove="1"/>
          <opentelemetry_span_log remove="1"/>
          <session_log remove="1"/>
          <part_log remove="1"/>
          <processors_profile_log remove="1"/>
          <blob_storage_log remove="1"/>
          <backup_log remove="1"/>
          <error_log remove="1"/>
          <latency_log remove="1"/>
      </clickhouse>

  # Query-level limits (users.d/, merged into PostHog's users.xml default profile).
  clickhouse_profile:
    content: |
      <clickhouse>
          <profiles>
              <default>
                  <!-- Upstream allows 10 GB per query. Spill to disk well before
                       ClickHouse's own budget is exhausted instead of OOM-killing. -->
                  <max_memory_usage>${CH_MAX_MEMORY_USAGE:-1610612736}</max_memory_usage>
                  <max_bytes_before_external_group_by>${CH_EXTERNAL_GROUP_BY:-805306368}</max_bytes_before_external_group_by>
                  <max_bytes_before_external_sort>${CH_EXTERNAL_SORT:-805306368}</max_bytes_before_external_sort>
                  <max_threads>${CH_MAX_THREADS:-4}</max_threads>
                  <use_uncompressed_cache>0</use_uncompressed_cache>
                  <log_query_threads>0</log_query_threads>
                  <log_processors_profiles>0</log_processors_profiles>
              </default>
          </profiles>
      </clickhouse>

  temporal_dynamicconfig:
    content: |
      limit.maxIDLength:
          - value: 255
            constraints: {}
      system.forceSearchAttributesCacheRefreshOnRead:
          - value: true
            constraints: {}
      system.visibilityDisableOrderByClause:
          - value: false
            constraints: {}

  livestream_config:
    content: |
      debug: false
      kafka:
          brokers: 'kafka:9092'
          topic: 'events_plugin_ingestion'
          group_id: 'livestream'
          security_protocol: 'PLAINTEXT'
          session_recording_enabled: true
          session_recording_security_protocol: 'PLAINTEXT'
      consumers:
          event:
              enabled: true
              brokers: 'kafka:9092'
              topic: 'events_plugin_ingestion'
              security_protocol: 'PLAINTEXT'
              group_id: 'livestream'
          session_recording:
              enabled: true
              brokers: 'kafka:9092'
              topic: 'session_recording_snapshot_item_events'
              security_protocol: 'PLAINTEXT'
              group_id: 'livestream-session-recordings'
          notification:
              enabled: false
      mmdb:
          path: '/share/GeoLite2-City.mmdb'

  # --- Verbatim from PostHog (comments stripped) -----------------------------
  # docker/clickhouse/config.xml
  clickhouse_config:
    content: |
      <?xml version="1.0"?>
      <clickhouse>
          <logger>
              <level>warning</level>
              <log>/var/log/clickhouse-server/clickhouse-server.log</log>
              <errorlog>/var/log/clickhouse-server/clickhouse-server.err.log</errorlog>
              <size>1000M</size>
              <count>10</count>
          </logger>
          <http_port>8123</http_port>
          <mysql_port>9004</mysql_port>
          <postgresql_port>9005</postgresql_port>
          <https_port>8443</https_port>
          <tcp_port_secure>9440</tcp_port_secure>
          <interserver_http_port>9009</interserver_http_port>
          <max_connections>4096</max_connections>
          <keep_alive_timeout>3</keep_alive_timeout>
          <openSSL>
              <server>
                  <certificateFile>/etc/clickhouse-server/server.crt</certificateFile>
                  <privateKeyFile>/etc/clickhouse-server/server.key</privateKeyFile>
                  <dhParamsFile>/etc/clickhouse-server/dhparam.pem</dhParamsFile>
                  <verificationMode>none</verificationMode>
                  <loadDefaultCAFile>true</loadDefaultCAFile>
                  <cacheSessions>true</cacheSessions>
                  <disableProtocols>sslv2,sslv3</disableProtocols>
                  <preferServerCiphers>true</preferServerCiphers>
              </server>
              <client>
                  <loadDefaultCAFile>true</loadDefaultCAFile>
                  <cacheSessions>true</cacheSessions>
                  <disableProtocols>sslv2,sslv3</disableProtocols>
                  <preferServerCiphers>true</preferServerCiphers>
                  <invalidCertificateHandler>
                      <name>RejectCertificateHandler</name>
                  </invalidCertificateHandler>
              </client>
          </openSSL>
          <max_concurrent_queries>200</max_concurrent_queries>
          <max_server_memory_usage>0</max_server_memory_usage>
          <background_message_broker_schedule_pool_size>128</background_message_broker_schedule_pool_size>
          <max_thread_pool_size>10000</max_thread_pool_size>
          <background_pool_size>4</background_pool_size>
          <background_merges_mutations_concurrency_ratio>8</background_merges_mutations_concurrency_ratio>
          <max_server_memory_usage_to_ram_ratio>0.9</max_server_memory_usage_to_ram_ratio>
          <total_memory_profiler_step>4194304</total_memory_profiler_step>
          <total_memory_tracker_sample_probability>0</total_memory_tracker_sample_probability>
          <uncompressed_cache_size>8589934592</uncompressed_cache_size>
          <mark_cache_size>5368709120</mark_cache_size>
          <mmap_cache_size>1000</mmap_cache_size>
          <compiled_expression_cache_size>134217728</compiled_expression_cache_size>
          <compiled_expression_cache_elements_size>10000</compiled_expression_cache_elements_size>
          <path>/var/lib/clickhouse/</path>
          <tmp_path>/var/lib/clickhouse/tmp/</tmp_path>
          <user_files_path>/var/lib/clickhouse/user_files/</user_files_path>
          <user_directories>
              <users_xml>
                  <path>users.xml</path>
              </users_xml>
              <local_directory>
                  <path>/var/lib/clickhouse/access/</path>
              </local_directory>
          </user_directories>
          <default_profile>default</default_profile>
          <custom_settings_prefixes></custom_settings_prefixes>
          <default_database>default</default_database>
          <mlock_executable>true</mlock_executable>
          <remap_executable>false</remap_executable>
          <remote_url_allow_hosts>
              <host_regexp>.*</host_regexp>
          </remote_url_allow_hosts>
          <zookeeper>
              <node>
                  <host>zookeeper</host>
                  <port>2181</port>
              </node>
          </zookeeper>
          <builtin_dictionaries_reload_interval>3600</builtin_dictionaries_reload_interval>
          <max_session_timeout>3600</max_session_timeout>
          <default_session_timeout>60</default_session_timeout>
          <query_log>
              <database>system</database>
              <table>query_log</table>
              <partition_by>toYYYYMM(event_date)</partition_by>
              <flush_interval_milliseconds>500</flush_interval_milliseconds>
              <max_size_rows>8388608</max_size_rows>
              <reserved_size_rows>8192</reserved_size_rows>
              <buffer_size_rows_flush_threshold>524288</buffer_size_rows_flush_threshold>
              <flush_on_crash>true</flush_on_crash>
              <ttl>event_date + INTERVAL 12 DAY</ttl>
              <ttl_only_drop_parts>1</ttl_only_drop_parts>
          </query_log>
          <query_thread_log>
              <database>system</database>
              <table>query_thread_log</table>
              <partition_by>toYYYYMM(event_date)</partition_by>
              <flush_interval_milliseconds>7500</flush_interval_milliseconds>
              <max_size_rows>8388608</max_size_rows>
              <reserved_size_rows>8192</reserved_size_rows>
              <buffer_size_rows_flush_threshold>524288</buffer_size_rows_flush_threshold>
              <flush_on_crash>false</flush_on_crash>
              <ttl>event_date + INTERVAL 5 DAY</ttl>
              <ttl_only_drop_parts>1</ttl_only_drop_parts>
          </query_thread_log>
          <query_views_log>
              <database>system</database>
              <table>query_views_log</table>
              <partition_by>toYYYYMM(event_date)</partition_by>
              <flush_interval_milliseconds>7500</flush_interval_milliseconds>
              <ttl>event_date + INTERVAL 5 DAY</ttl>
              <ttl_only_drop_parts>1</ttl_only_drop_parts>
          </query_views_log>
          <text_log>
              <database>system</database>
              <table>text_log</table>
              <flush_interval_milliseconds>7500</flush_interval_milliseconds>
              <level>trace</level>
              <ttl>event_date + INTERVAL 5 DAY</ttl>
              <ttl_only_drop_parts>1</ttl_only_drop_parts>
          </text_log>
          <metric_log>
              <database>system</database>
              <table>metric_log</table>
              <flush_interval_milliseconds>7500</flush_interval_milliseconds>
              <collect_interval_milliseconds>1000</collect_interval_milliseconds>
              <ttl>event_date + INTERVAL 5 DAY</ttl>
              <ttl_only_drop_parts>1</ttl_only_drop_parts>
          </metric_log>
          <asynchronous_metric_log>
              <database>system</database>
              <table>asynchronous_metric_log</table>
              <flush_interval_milliseconds>7000</flush_interval_milliseconds>
              <ttl>event_date + INTERVAL 5 DAY</ttl>
              <ttl_only_drop_parts>1</ttl_only_drop_parts>
          </asynchronous_metric_log>
          <opentelemetry_span_log>
              <engine>
                  engine MergeTree
                  partition by toYYYYMM(finish_date)
                  order by (finish_date, finish_time_us, trace_id)
              </engine>
              <database>system</database>
              <table>opentelemetry_span_log</table>
              <flush_interval_milliseconds>7500</flush_interval_milliseconds>
          </opentelemetry_span_log>
          <crash_log>
              <database>system</database>
              <table>crash_log</table>
              <partition_by />
              <flush_interval_milliseconds>1000</flush_interval_milliseconds>
              <max_size_rows>1024</max_size_rows>
              <reserved_size_rows>1024</reserved_size_rows>
              <buffer_size_rows_flush_threshold>512</buffer_size_rows_flush_threshold>
              <flush_on_crash>true</flush_on_crash>
          </crash_log>
          <session_log>
              <database>system</database>
              <table>session_log</table>
              <partition_by>toYYYYMM(event_date)</partition_by>
              <flush_interval_milliseconds>7500</flush_interval_milliseconds>
              <ttl>event_date + INTERVAL 5 DAY</ttl>
              <ttl_only_drop_parts>1</ttl_only_drop_parts>
          </session_log>
          <backup_log>
              <database>system</database>
              <table>backup_log</table>
              <partition_by>toYYYYMM(event_date)</partition_by>
              <flush_interval_milliseconds>7500</flush_interval_milliseconds>
              <ttl>event_date + INTERVAL 5 DAY</ttl>
              <ttl_only_drop_parts>1</ttl_only_drop_parts>
          </backup_log>
          <top_level_domains_lists>
          </top_level_domains_lists>
          <dictionaries_config>*_dictionary.xml</dictionaries_config>
          <user_defined_executable_functions_config>*_function.xml</user_defined_executable_functions_config>
          <distributed_ddl>
              <path>/clickhouse/task_queue/ddl</path>
          </distributed_ddl>
          <graphite_rollup_example>
              <pattern>
                  <regexp>click_cost</regexp>
                  <function>any</function>
                  <retention>
                      <age>0</age>
                      <precision>3600</precision>
                  </retention>
                  <retention>
                      <age>86400</age>
                      <precision>60</precision>
                  </retention>
              </pattern>
              <default>
                  <function>max</function>
                  <retention>
                      <age>0</age>
                      <precision>60</precision>
                  </retention>
                  <retention>
                      <age>3600</age>
                      <precision>300</precision>
                  </retention>
                  <retention>
                      <age>86400</age>
                      <precision>3600</precision>
                  </retention>
              </default>
          </graphite_rollup_example>
          <format_schema_path>/var/lib/clickhouse/format_schemas/</format_schema_path>
          <query_masking_rules>
              <rule>
                  <name>hide encrypt/decrypt arguments</name>
                  <regexp>((?:aes_)?(?:encrypt|decrypt)(?:_mysql)?)\s*\(\s*(?:'(?:\\'|.)+'|.*?)\s*\)</regexp>
                  <replace>\1(???)</replace>
              </rule>
          </query_masking_rules>
          <merge_tree>
              <max_bytes_to_merge_at_max_space_in_pool>1073741824</max_bytes_to_merge_at_max_space_in_pool>
              <number_of_free_entries_in_pool_to_execute_mutation>2</number_of_free_entries_in_pool_to_execute_mutation>
              <number_of_free_entries_in_pool_to_execute_optimize_entire_partition>2</number_of_free_entries_in_pool_to_execute_optimize_entire_partition>
          </merge_tree>
      </clickhouse>

  # docker/clickhouse/users.xml
  clickhouse_users:
    content: |
      <?xml version="1.0"?>
      <yandex>
          <profiles>
              <default>
                  <max_memory_usage>10000000000</max_memory_usage>
                  <load_balancing>random</load_balancing>
                  <allow_nondeterministic_mutations>1</allow_nondeterministic_mutations>
                  <compatibility>26.3</compatibility>
                  <enable_materialized_cte>1</enable_materialized_cte>
                  <async_insert>0</async_insert>
                  <optimize_empty_string_comparisons>0</optimize_empty_string_comparisons>
                  <distributed_product_mode>global</distributed_product_mode>
                  <enable_parallel_replicas>0</enable_parallel_replicas>
                  <max_parallel_replicas>1</max_parallel_replicas>
                  <allow_experimental_window_functions>1</allow_experimental_window_functions>
                  <allow_suspicious_low_cardinality_types>1</allow_suspicious_low_cardinality_types>
                  <insert_distributed_sync>1</insert_distributed_sync>
                  <throw_on_max_partitions_per_insert_block>false</throw_on_max_partitions_per_insert_block>
                  <number_of_mutations_to_throw>1</number_of_mutations_to_throw>
              </default>
              <readonly>
                  <readonly>1</readonly>
              </readonly>
              <api>
                  <profile>default</profile>
              </api>
              <app>
                  <profile>default</profile>
              </app>
          </profiles>
          <users>
              <default>
                  <password></password>
                  <networks>
                      <ip>::/0</ip>
                  </networks>
                  <profile>default</profile>
                  <quota>default</quota>
                  <access_management>1</access_management>
                  <named_collection_control>1</named_collection_control>
                  <show_named_collections>1</show_named_collections>
                  <show_named_collections_secrets>1</show_named_collections_secrets>
              </default>
              <api>
                  <password>apipass</password>
                  <networks>
                      <ip>::/0</ip>
                  </networks>
                  <profile>api</profile>
                  <quota>default</quota>
              </api>
              <app>
                  <password>apppass</password>
                  <networks>
                      <ip>::/0</ip>
                  </networks>
                  <profile>app</profile>
                  <quota>default</quota>
              </app>
              <dict_reader>
                  <password>dictreaderpass</password>
                  <networks>
                      <ip>::/0</ip>
                  </networks>
                  <profile>readonly</profile>
                  <quota>default</quota>
                  <access_management>0</access_management>
                  <grants>
                      <query>GRANT SELECT ON default.*</query>
                      <query>GRANT SELECT ON posthog.*</query>
                      <query>GRANT SELECT ON posthog_test.*</query>
                  </grants>
              </dict_reader>
          </users>
          <quotas>
              <default>
                  <interval>
                      <duration>3600</duration>
                      <queries>0</queries>
                      <errors>0</errors>
                      <result_rows>0</result_rows>
                      <read_rows>0</read_rows>
                      <execution_time>0</execution_time>
                  </interval>
              </default>
          </quotas>
      </yandex>

  # docker/clickhouse/config.d/default.xml
  clickhouse_cluster:
    content: |
      <clickhouse>
          <tcp_port>9000</tcp_port>
          <remote_servers>
              <posthog>
                  <shard>
                      <replica>
                          <host>clickhouse</host>
                          <port>9000</port>
                      </replica>
                  </shard>
              </posthog>
              <posthog_single_shard>
                  <shard>
                      <replica>
                          <host>clickhouse</host>
                          <port>9000</port>
                      </replica>
                  </shard>
              </posthog_single_shard>
              <posthog_migrations>
                  <shard>
                      <replica>
                          <host>clickhouse</host>
                          <port>9000</port>
                      </replica>
                  </shard>
              </posthog_migrations>
              <posthog_writable>
                  <shard>
                      <replica>
                          <host>clickhouse</host>
                          <port>9000</port>
                      </replica>
                  </shard>
              </posthog_writable>
              <posthog_primary_replica>
                  <shard>
                      <replica>
                          <host>clickhouse</host>
                          <port>9000</port>
                      </replica>
                  </shard>
              </posthog_primary_replica>
              <ai_events>
                  <shard>
                      <replica>
                          <host>clickhouse</host>
                          <port>9000</port>
                      </replica>
                  </shard>
              </ai_events>
              <aux>
                  <shard>
                      <replica>
                          <host>clickhouse</host>
                          <port>9000</port>
                      </replica>
                  </shard>
              </aux>
              <ops>
                  <shard>
                      <replica>
                          <host>clickhouse</host>
                          <port>9000</port>
                      </replica>
                  </shard>
              </ops>
              <sessions>
                  <shard>
                      <replica>
                          <host>clickhouse</host>
                          <port>9000</port>
                      </replica>
                  </shard>
              </sessions>
          </remote_servers>
          <named_collections>
              <msk_cluster>
                  <kafka_broker_list from_env="KAFKA_HOSTS"/>
              </msk_cluster>
              <warpstream_ingestion>
                  <kafka_broker_list from_env="KAFKA_HOSTS"/>
              </warpstream_ingestion>
              <warpstream_calculated_events>
                  <kafka_broker_list from_env="KAFKA_HOSTS"/>
              </warpstream_calculated_events>
              <warpstream_replay>
                  <kafka_broker_list from_env="KAFKA_HOSTS"/>
              </warpstream_replay>
              <warpstream_shared>
                  <kafka_broker_list from_env="KAFKA_HOSTS"/>
              </warpstream_shared>
              <warpstream_cyclotron>
                  <kafka_broker_list from_env="KAFKA_HOSTS"/>
              </warpstream_cyclotron>
              <warpstream_logs>
                  <kafka_broker_list from_env="KAFKA_HOSTS"/>
              </warpstream_logs>
              <warpstream_traces>
                  <kafka_broker_list from_env="KAFKA_HOSTS"/>
              </warpstream_traces>
              <warpstream_metrics>
                  <kafka_broker_list from_env="KAFKA_HOSTS"/>
              </warpstream_metrics>
          </named_collections>
          <macros>
              <shard>01</shard>
              <replica>ch1</replica>
              <hostClusterType>online</hostClusterType>
              <hostClusterRole>data</hostClusterRole>
          </macros>
      </clickhouse>

