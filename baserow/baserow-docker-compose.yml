# Self-hosted Baserow for Dokploy
#
# Standalone Docker Compose template — paste this and `baserow.env` into Dokploy
# and deploy. No external files needed: the Caddyfile is embedded inline via the
# `configs` block below.
#
# Architecture (8 containers):
#   caddy            — internal reverse proxy (HTTP only; Dokploy/Traefik fronts TLS)
#   backend          — Django REST API
#   web-frontend     — Nuxt UI
#   celery           — async task worker
#   celery-export    — dedicated export worker
#   celery-beat      — scheduled task dispatcher
#   db               — PostgreSQL 15 + pgvector
#   redis            — cache + broker
#   (volume-fixer)   — one-shot init job that chowns the media volume
#
# Add a Dokploy domain pointing at the `caddy` service on port 80.

name: baserow

# ─────────────────────────────────────────────────────────────────────
# Inline Caddyfile — routes requests between backend / web-frontend
# and serves uploaded files from the shared media volume.
# ─────────────────────────────────────────────────────────────────────
configs:

  caddyfile:
    content: |
      {
          # Behind Dokploy/Traefik we do not need on-demand TLS — Traefik handles certs.
          auto_https off
          admin off
          {$$BASEROW_CADDY_GLOBAL_CONF}
      }

      {$$BASEROW_CADDY_ADDRESSES} {
          @is_baserow_tool {
              expression `
                  "{$$BASEROW_PUBLIC_URL}".contains({http.request.host}) ||
                  "{$$BASEROW_EXTRA_PUBLIC_URLS}".split(",")
                      .filter(u, u != "" && u.contains({http.request.host}))
                      .size() > 0
              `
          }

          handle @is_baserow_tool {
              @backend_routes path /api/* /ws/* /mcp/* /assistant/* {$$BASEROW_CADDY_BACKEND_EXTRA_ROUTES:}
              handle @backend_routes {
                  reverse_proxy {$$PRIVATE_BACKEND_URL:http://backend:8000}
              }

              handle_path /media/* {
                  @downloads {
                      query dl=*
                  }
                  header @downloads Content-disposition "attachment; filename={query.dl}"

                  header {
                      Access-Control-Allow-Origin {$$BASEROW_PUBLIC_URL:http://localhost}
                      Access-Control-Allow-Methods "GET, HEAD, OPTIONS"
                      Access-Control-Allow-Headers "*"
                      Access-Control-Expose-Headers "Content-Length, Content-Type"
                  }

                  file_server {
                      root {$$MEDIA_ROOT:/baserow/media/}
                  }
              }

              handle_path /static/* {
                  file_server {
                      root {$$STATIC_ROOT:/baserow/static/}
                  }
              }
          }

          reverse_proxy {$$PRIVATE_WEB_FRONTEND_URL:http://web-frontend:3000}
      }

# ─────────────────────────────────────────────────────────────────────
# Anchor: every Baserow service container shares the same backend env.
#
# Convention used here (matches upstream baserow/baserow compose):
#   * Required secrets        — `KEY: ${KEY:?msg}` so deploy fails fast.
#   * Vars with a real default — `KEY: ${KEY:-default}` always set.
#   * Optional vars            — `KEY:` (bare key, no value). Compose
#     ONLY forwards them if they're defined in the parent env. If you
#     leave a `KEY=` line empty in `baserow.env`, Dokploy still passes
#     `KEY=""`, which crashes Baserow on numeric coercions like
#     `int(os.getenv("X", 180))`. So in the env file, *delete* (don't
#     blank) any optional var you're not using.
# ─────────────────────────────────────────────────────────────────────
x-backend-variables: &backend-variables
  # ─── Required secrets ──────────────────────────────────────────────
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD required}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}

  # ─── Hard defaults ─────────────────────────────────────────────────
  BASEROW_PUBLIC_URL: ${BASEROW_PUBLIC_URL:-http://localhost}
  DATABASE_USER: ${DATABASE_USER:-baserow}
  DATABASE_NAME: ${DATABASE_NAME:-baserow}
  DATABASE_HOST: ${DATABASE_HOST:-db}
  DATABASE_PORT: ${DATABASE_PORT:-5432}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PROTOCOL: ${REDIS_PROTOCOL:-redis}
  MIGRATE_ON_STARTUP: ${MIGRATE_ON_STARTUP:-true}
  SYNC_TEMPLATES_ON_STARTUP: ${SYNC_TEMPLATES_ON_STARTUP:-true}
  PRIVATE_BACKEND_URL: ${PRIVATE_BACKEND_URL:-http://backend:8000}
  MEDIA_ROOT: ${MEDIA_ROOT:-/baserow/media}
  BASEROW_DEPLOYMENT_ENV: ${BASEROW_DEPLOYMENT_ENV:-docker-compose}

  # ─── Optional passthrough (only forwarded if set in baserow.env) ───
  #
  # IMPORTANT: To use an external DB / Redis, add DATABASE_URL or
  # REDIS_URL to baserow.env with a real value. Do NOT leave them as
  # `=` blanks — Baserow checks `if "DATABASE_URL" in os.environ` and
  # would parse the empty string as a connection URL and crash.
  BASEROW_JWT_SIGNING_KEY:
  BASEROW_EXTRA_PUBLIC_URLS:
  BASEROW_EXTRA_ALLOWED_HOSTS:
  BASEROW_ENABLE_SECURE_PROXY_SSL_HEADER:
  BASEROW_DISABLE_PUBLIC_URL_CHECK:
  DATABASE_URL:
  DATABASE_OPTIONS:
  REDIS_URL:
  REDIS_USER:

  # Email / SMTP
  EMAIL_SMTP:
  EMAIL_SMTP_HOST:
  EMAIL_SMTP_PORT:
  EMAIL_SMTP_USE_TLS:
  EMAIL_SMTP_USE_SSL:
  EMAIL_SMTP_USER:
  EMAIL_SMTP_PASSWORD:
  FROM_EMAIL:

  # S3-compatible object storage
  AWS_ACCESS_KEY_ID:
  AWS_SECRET_ACCESS_KEY:
  AWS_STORAGE_BUCKET_NAME:
  AWS_S3_REGION_NAME:
  AWS_S3_ENDPOINT_URL:
  AWS_S3_CUSTOM_DOMAIN:

  # Workers & limits
  BASEROW_AMOUNT_OF_GUNICORN_WORKERS:
  BASEROW_AMOUNT_OF_WORKERS:
  BASEROW_RUN_MINIMAL:
  BASEROW_ROW_PAGE_SIZE_LIMIT:
  BATCH_ROWS_SIZE_LIMIT:
  INITIAL_TABLE_DATA_LIMIT:
  BASEROW_FILE_UPLOAD_SIZE_LIMIT_MB:
  BASEROW_MAX_IMPORT_FILE_SIZE_MB:
  BASEROW_UNIQUE_ROW_VALUES_SIZE_LIMIT:

  # Startup
  BASEROW_TRIGGER_SYNC_TEMPLATES_AFTER_MIGRATION:

  # Logging
  BASEROW_BACKEND_DEBUG:
  BASEROW_BACKEND_LOG_LEVEL:

  # URLs derived from BASEROW_PUBLIC_URL — leave blank to auto-derive
  PUBLIC_BACKEND_URL:
  PUBLIC_WEB_FRONTEND_URL:
  BASEROW_EMBEDDED_SHARE_URL:
  MEDIA_URL:

  # Tokens & sessions
  BASEROW_ACCESS_TOKEN_LIFETIME_MINUTES:
  BASEROW_REFRESH_TOKEN_LIFETIME_HOURS:

  # Throttling
  BASEROW_MAX_CONCURRENT_USER_REQUESTS:
  BASEROW_CONCURRENT_USER_REQUESTS_THROTTLE_TIMEOUT:
  BASEROW_SEND_VERIFY_EMAIL_RATE_LIMIT:

  # Webhooks
  BASEROW_WEBHOOKS_ALLOW_PRIVATE_ADDRESS:
  BASEROW_WEBHOOKS_MAX_RETRIES_PER_CALL:

  # AI integrations
  OPENAI_API_KEY:
  BASEROW_OPENAI_API_KEY:
  BASEROW_OPENAI_MODELS:
  BASEROW_ANTHROPIC_API_KEY:
  BASEROW_ANTHROPIC_MODELS:
  BASEROW_MISTRAL_API_KEY:
  BASEROW_MISTRAL_MODELS:
  BASEROW_OLLAMA_HOST:
  BASEROW_OLLAMA_MODELS:

  # Telemetry
  SENTRY_DSN:
  SENTRY_BACKEND_DSN:
  BASEROW_ENABLE_OTEL:
  POSTHOG_PROJECT_API_KEY:
  POSTHOG_HOST:

  # Misc
  BASEROW_DISABLE_GOOGLE_DOCS_FILE_PREVIEW:
  BASEROW_DISABLE_SUPPORT:
  FEATURE_FLAGS:
  ADDITIONAL_APPS:
  ADDITIONAL_MODULES:

# ─────────────────────────────────────────────────────────────────────
# Shared logging policy — rotate JSON logs so the host disk stays sane.
# ─────────────────────────────────────────────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

services:

  # ───────────────────────────────────────────────────────────────────
  # Caddy — internal reverse proxy. Dokploy/Traefik terminates TLS in
  # front of this; Caddy listens on plain HTTP (port 80 inside the
  # container) and routes /api, /ws, /mcp, /assistant to backend, /media
  # and /static to the media/static volumes, and everything else to the
  # web-frontend.
  # ───────────────────────────────────────────────────────────────────
  caddy:
    container_name: ${CONTAINER_PREFIX:-baserow}-caddy
    image: caddy:2.10.2
    restart: unless-stopped
    environment:
      BASEROW_CADDY_ADDRESSES: ${BASEROW_CADDY_ADDRESSES:-:80}
      PRIVATE_BACKEND_URL: ${PRIVATE_BACKEND_URL:-http://backend:8000}
      PRIVATE_WEB_FRONTEND_URL: ${PRIVATE_WEB_FRONTEND_URL:-http://web-frontend:3000}
      BASEROW_PUBLIC_URL: ${BASEROW_PUBLIC_URL:-http://localhost}
      MEDIA_ROOT: ${MEDIA_ROOT:-/baserow/media/}
      STATIC_ROOT: ${STATIC_ROOT:-/baserow/static/}
      # Bare-key passthrough — only forwarded if non-empty in baserow.env.
      BASEROW_CADDY_GLOBAL_CONF:
      BASEROW_CADDY_BACKEND_EXTRA_ROUTES:
      BASEROW_EXTRA_PUBLIC_URLS:
    expose:
      - 80
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - media:/baserow/media
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
      web-frontend:
        condition: service_started
    healthcheck:
      # Caddy only proxies when the Host header matches BASEROW_PUBLIC_URL,
      # so plain `wget http://localhost:80` 404s. Pass the configured host
      # via the runtime env var (Caddy already has it). $$VAR escapes the $
      # so Compose doesn't try to interpolate; the container shell does it.
      test:
        - "CMD-SHELL"
        - "wget -q --tries=1 --spider --header=\"Host: $${BASEROW_PUBLIC_URL#http*://}\" http://127.0.0.1:80/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: ${CADDY_MEM_LIMIT:-4g}
    networks:
      - default
      - dokploy-network
    logging: *default-logging

  # ───────────────────────────────────────────────────────────────────
  # Backend — Django REST + websocket API.
  # Internal only (no dokploy-network) — only caddy is exposed.
  # ───────────────────────────────────────────────────────────────────
  backend:
    container_name: ${CONTAINER_PREFIX:-baserow}-backend
    image: baserow/backend:${BASEROW_VERSION:-2.2.2}
    restart: unless-stopped
    environment:
      <<: *backend-variables
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      volume-permissions-fixer:
        condition: service_completed_successfully
    volumes:
      - media:/baserow/media
    healthcheck:
      test: ["CMD-SHELL", "/baserow/backend/docker/docker-entrypoint.sh backend-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: ${BACKEND_MEM_LIMIT:-4g}
    logging: *default-logging

  # ───────────────────────────────────────────────────────────────────
  # Web frontend — Nuxt UI
  # ───────────────────────────────────────────────────────────────────
  web-frontend:
    container_name: ${CONTAINER_PREFIX:-baserow}-web-frontend
    image: baserow/web-frontend:${BASEROW_VERSION:-2.2.2}
    restart: unless-stopped
    environment:
      BASEROW_PUBLIC_URL: ${BASEROW_PUBLIC_URL:-http://localhost}
      PRIVATE_BACKEND_URL: ${PRIVATE_BACKEND_URL:-http://backend:8000}
      BASEROW_DEPLOYMENT_ENV: ${BASEROW_DEPLOYMENT_ENV:-docker-compose}
      # Bare-key passthrough — only forwarded if non-empty in baserow.env.
      BASEROW_EXTRA_PUBLIC_URLS:
      PUBLIC_BACKEND_URL:
      PUBLIC_WEB_FRONTEND_URL:
      BASEROW_EMBEDDED_SHARE_URL:
      BASEROW_DISABLE_PUBLIC_URL_CHECK:
      INITIAL_TABLE_DATA_LIMIT:
      DOWNLOAD_FILE_VIA_XHR:
      BASEROW_DISABLE_GOOGLE_DOCS_FILE_PREVIEW:
      BASEROW_DISABLE_SUPPORT:
      HOURS_UNTIL_TRASH_PERMANENTLY_DELETED:
      DISABLE_ANONYMOUS_PUBLIC_VIEW_WS_CONNECTIONS:
      FEATURE_FLAGS:
      ADDITIONAL_MODULES:
      BASEROW_MAX_IMPORT_FILE_SIZE_MB:
      BASEROW_MAX_SNAPSHOTS_PER_GROUP:
      BASEROW_OSS_ONLY:
      POSTHOG_PROJECT_API_KEY:
      POSTHOG_HOST:
      SENTRY_DSN:
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      # The 2.2.2 web-frontend image no longer ships a `web-frontend-healthcheck`
      # entrypoint subcommand (older docs reference it). Probe the Nitro server
      # directly. The frontend SSRs every URL, so any 200 path is fine — `/login`
      # is one of the lightest. Run inside the container with node since the
      # base image is distroless / has no wget.
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://127.0.0.1:3000/login', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: ${WEB_FRONTEND_MEM_LIMIT:-4g}
    logging: *default-logging

  # ───────────────────────────────────────────────────────────────────
  # Celery — general async task worker (signals, table updates, etc.)
  # ───────────────────────────────────────────────────────────────────
  celery:
    container_name: ${CONTAINER_PREFIX:-baserow}-celery
    image: baserow/backend:${BASEROW_VERSION:-2.2.2}
    restart: unless-stopped
    command: celery-worker
    environment:
      <<: *backend-variables
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      volume-permissions-fixer:
        condition: service_completed_successfully
    volumes:
      - media:/baserow/media
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/baserow/backend/docker/docker-entrypoint.sh celery-worker-healthcheck"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: ${CELERY_MEM_LIMIT:-4g}
    logging: *default-logging

  # ───────────────────────────────────────────────────────────────────
  # Celery export worker — handles CSV/JSON/XLSX exports on its own queue
  # so big exports don't block normal tasks.
  #
  # NOTE: If you're memory-constrained, set BASEROW_RUN_MINIMAL=true AND
  # BASEROW_AMOUNT_OF_WORKERS=1 — Baserow's entrypoint then turns THIS
  # container into a `sleep` shim (the main celery worker picks up the
  # export queue too). In that combined mode the healthcheck below would
  # always fail, so remove the healthcheck block when fusing queues.
  # ───────────────────────────────────────────────────────────────────
  celery-export-worker:
    container_name: ${CONTAINER_PREFIX:-baserow}-celery-export
    image: baserow/backend:${BASEROW_VERSION:-2.2.2}
    restart: unless-stopped
    command: celery-exportworker
    environment:
      <<: *backend-variables
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      volume-permissions-fixer:
        condition: service_completed_successfully
    volumes:
      - media:/baserow/media
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/baserow/backend/docker/docker-entrypoint.sh celery-exportworker-healthcheck"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: ${CELERY_EXPORT_MEM_LIMIT:-4g}
    logging: *default-logging

  # ───────────────────────────────────────────────────────────────────
  # Celery beat — schedules periodic tasks (trash cleanup, periodic
  # field updates, etc.). SIGQUIT is required for clean shutdown.
  # ───────────────────────────────────────────────────────────────────
  celery-beat-worker:
    container_name: ${CONTAINER_PREFIX:-baserow}-celery-beat
    image: baserow/backend:${BASEROW_VERSION:-2.2.2}
    restart: unless-stopped
    command: celery-beat
    stop_signal: SIGQUIT
    environment:
      <<: *backend-variables
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      volume-permissions-fixer:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/baserow/backend/docker/docker-entrypoint.sh celery-beat-healthcheck"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: ${CELERY_BEAT_MEM_LIMIT:-4g}
    logging: *default-logging

  # ───────────────────────────────────────────────────────────────────
  # Postgres 15 with pgvector — Baserow requires the pgvector extension
  # for AI / embeddings features.
  # ───────────────────────────────────────────────────────────────────
  db:
    container_name: ${CONTAINER_PREFIX:-baserow}-db
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-baserow}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD required}
      POSTGRES_DB: ${DATABASE_NAME:-baserow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-baserow} -d ${DATABASE_NAME:-baserow}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    shm_size: ${PG_SHM_SIZE:-256mb}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1GB}"
      - "-c"
      - "work_mem=${PG_WORK_MEM:-4MB}"
      - "-c"
      - "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}"
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS:-100}"
      - "-c"
      - "random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}"
      - "-c"
      - "effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-200}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: ${DB_MEM_LIMIT:-4g}
    logging: *default-logging

  # ───────────────────────────────────────────────────────────────────
  # Redis — cache + Celery broker (Baserow requires `redis:6` features)
  # ───────────────────────────────────────────────────────────────────
  redis:
    container_name: ${CONTAINER_PREFIX:-baserow}-redis
    image: redis:6
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD required}"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-512mb}"
      - "--maxmemory-policy"
      - "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: ${REDIS_MEM_LIMIT:-4g}
    logging: *default-logging

  # ───────────────────────────────────────────────────────────────────
  # One-shot init job — the media volume mounts as root by default but
  # Baserow's Django process runs as UID 9999. Without this fixer, the
  # backend cannot write uploaded files into /baserow/media.
  # ───────────────────────────────────────────────────────────────────
  volume-permissions-fixer:
    container_name: ${CONTAINER_PREFIX:-baserow}-volume-fixer
    image: bash:4.4
    command: chown 9999:9999 -R /baserow/media
    volumes:
      - media:/baserow/media
    restart: "no"

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:

networks:
  dokploy-network:
    external: true
