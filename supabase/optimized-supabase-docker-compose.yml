# Production-optimized Supabase for Hetzner (16 vCPU, 64GB RAM, NVMe SSD)
#
# Usage:
#   Start:    docker compose -f optimized-supabase-docker-compose.yml --env-file optimized-supabase.env up -d
#   Stop:     docker compose -f optimized-supabase-docker-compose.yml --env-file optimized-supabase.env down
#   Destroy:  docker compose -f optimized-supabase-docker-compose.yml --env-file optimized-supabase.env down -v --remove-orphans
#
# Standalone template: all config files are embedded inline via Docker Compose configs.
# Just paste this compose + env file into Dokploy and deploy — no file mounts needed.
#
# Changes from supabase-docker-compose.yml (same images and security fixes,
# only the sizing defaults differ):
#   - PostgreSQL defaults tuned for NVMe SSD / 8+ vCPU via env-var driven -c flags
#   - Realtime defaults scaled for 500+ concurrent users
#   - shm_size default raised for the larger shared_buffers
#   - Supavisor BEAM scheduler flags sized for 16 vCPU
#   - Optional ../files/.env.functions env file for edge function secrets

name: supabase

# ═══════════════════════════════════════════════════════════════════
# Inline config files — embedded so the compose is fully standalone
# ═══════════════════════════════════════════════════════════════════
configs:

  kong_config:
    content: |
      _format_version: '2.1'
      _transform: true

      ###
      ### Consumers / Users
      ###
      consumers:
        - username: DASHBOARD
        - username: anon
          keyauth_credentials:
            - key: $$SUPABASE_ANON_KEY
            - key: $$SUPABASE_PUBLISHABLE_KEY
        - username: service_role
          keyauth_credentials:
            - key: $$SUPABASE_SERVICE_KEY
            - key: $$SUPABASE_SECRET_KEY

      ###
      ### Access Control List
      ###
      acls:
        - consumer: anon
          group: anon
        - consumer: service_role
          group: admin

      ###
      ### Dashboard credentials
      ###
      basicauth_credentials:
        - consumer: DASHBOARD
          username: '$$DASHBOARD_USERNAME'
          password: '$$DASHBOARD_PASSWORD'

      ###
      ### API Routes
      ###
      services:
        ## Open Auth routes
        - name: auth-v1-open
          _comment: 'Auth: /auth/v1/verify* -> http://auth:9999/verify*'
          url: http://auth:9999/verify
          routes:
            - name: auth-v1-open
              strip_path: true
              paths:
                - /auth/v1/verify
          plugins:
            - name: cors
        - name: auth-v1-open-callback
          _comment: 'Auth: /auth/v1/callback* -> http://auth:9999/callback*'
          url: http://auth:9999/callback
          routes:
            - name: auth-v1-open-callback
              strip_path: true
              paths:
                - /auth/v1/callback
          plugins:
            - name: cors
        - name: auth-v1-open-authorize
          _comment: 'Auth: /auth/v1/authorize* -> http://auth:9999/authorize*'
          url: http://auth:9999/authorize
          routes:
            - name: auth-v1-open-authorize
              strip_path: true
              paths:
                - /auth/v1/authorize
          plugins:
            - name: cors
        - name: auth-v1-open-jwks
          _comment: 'Auth: /auth/v1/.well-known/jwks.json -> http://auth:9999/.well-known/jwks.json'
          url: http://auth:9999/.well-known/jwks.json
          routes:
            - name: auth-v1-open-jwks
              strip_path: true
              paths:
                - /auth/v1/.well-known/jwks.json
          plugins:
            - name: cors

        - name: auth-v1-open-sso-acs
          url: "http://auth:9999/sso/saml/acs"
          routes:
            - name: auth-v1-open-sso-acs
              strip_path: true
              paths:
              - /auth/v1/sso/saml/acs
          plugins:
            - name: cors

        - name: auth-v1-open-sso-metadata
          url: "http://auth:9999/sso/saml/metadata"
          routes:
            - name: auth-v1-open-sso-metadata
              strip_path: true
              paths:
              - /auth/v1/sso/saml/metadata
          plugins:
            - name: cors

        ## Secure Auth routes
        - name: auth-v1
          _comment: 'Auth: /auth/v1/* -> http://auth:9999/*'
          url: http://auth:9999/
          routes:
            - name: auth-v1-all
              strip_path: true
              paths:
                - /auth/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## OpenAPI root - admin only
        - name: rest-v1-openapi
          _comment: 'PostgREST OpenAPI root: /rest/v1/ -> <http://rest:3000/> (admin only). See <https://github.com/orgs/supabase/discussions/42949>'
          url: http://rest:3000/
          routes:
            - name: rest-v1-openapi-root
              strip_path: true
              expression: 'http.path == "/rest/v1/"'
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin

        ## Secure PostgREST routes
        - name: rest-v1
          _comment: 'PostgREST: /rest/v1/* -> http://rest:3000/*'
          url: http://rest:3000/
          routes:
            - name: rest-v1-all
              strip_path: true
              paths:
                - /rest/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## Secure GraphQL routes
        - name: graphql-v1
          _comment: 'PostgREST: /graphql/v1/* -> http://rest:3000/rpc/graphql'
          url: http://rest:3000/rpc/graphql
          routes:
            - name: graphql-v1-all
              strip_path: true
              paths:
                - /graphql/v1
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Content-Profile: graphql_public"
                    - "Authorization: $$LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## Secure Realtime routes
        - name: realtime-v1-ws
          _comment: 'Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*'
          url: http://realtime-dev.${CONTAINER_PREFIX}-realtime:4000/socket
          protocol: ws
          routes:
            - name: realtime-v1-ws
              strip_path: true
              paths:
                - /realtime/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "x-api-key:$$LUA_RT_WS_EXPR"
                replace:
                  querystring:
                    - "apikey:$$LUA_RT_WS_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        # Block access to /realtime/v1/api/openapi
        - name: realtime-v1-rest-openapi
          _comment: 'Realtime: /realtime/v1/api/openapi/* -> http://realtime:4000/api/openapi/* (blocked)'
          url: http://realtime-dev.${CONTAINER_PREFIX}-realtime:4000/api/openapi
          protocol: http
          routes:
            - name: realtime-v1-rest-openapi
              strip_path: true
              paths:
                - /realtime/v1/api/openapi
          plugins:
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."

        # Block access to /realtime/v1/api/tenants
        - name: realtime-v1-rest-tenants
          _comment: 'Realtime: /realtime/v1/api/tenants/* -> http://realtime:4000/api/tenants/* (blocked)'
          url: http://realtime-dev.${CONTAINER_PREFIX}-realtime:4000/api/tenants
          protocol: http
          routes:
            - name: realtime-v1-rest-tenants
              strip_path: true
              paths:
                - /realtime/v1/api/tenants
          plugins:
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."

        - name: realtime-v1-rest
          _comment: 'Realtime: /realtime/v1/api/* -> http://realtime:4000/api/*'
          url: http://realtime-dev.${CONTAINER_PREFIX}-realtime:4000/api
          protocol: http
          routes:
            - name: realtime-v1-rest
              strip_path: true
              paths:
                - /realtime/v1/api
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## Storage API endpoint (with Authorization header transformation).
        ## No key-auth - S3 protocol requests don't carry an apikey header.
        ##
        ## The request-transformer translates opaque API keys to asymmetric JWTs
        ## and passes through existing Authorization headers (user JWTs, AWS SigV4).
        ## When no Authorization or apikey header is present (S3 presigned URLs),
        ## the Lua expression evaluates to nil which Kong renders as empty string.
        ## The post-function strips this empty header so Storage's S3 signature
        ## verification falls through to query-parameter parsing.
        - name: storage-v1
          _comment: 'Storage: /storage/v1/* -> http://storage:5000/*'
          url: http://storage:5000/
          routes:
            - name: storage-v1-all
              strip_path: true
              paths:
                - /storage/v1/
          plugins:
            - name: cors
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
            - name: post-function
              config:
                access:
                  - |
                    local auth = kong.request.get_header("authorization")
                    if auth == nil or auth == "" or auth:find("^%s*$$") then
                      kong.service.request.clear_header("authorization")
                    end

        ## Edge Functions routes
        - name: functions-v1
          _comment: 'Edge Functions: /functions/v1/* -> http://functions:9000/*'
          url: http://functions:9000/
          read_timeout: 150000
          routes:
            - name: functions-v1-all
              strip_path: true
              paths:
                - /functions/v1/
          plugins:
            - name: cors

        ## OAuth 2.0 Authorization Server Metadata (RFC 8414)
        - name: well-known-oauth
          _comment: 'Auth: /.well-known/oauth-authorization-server -> http://auth:9999/.well-known/oauth-authorization-server'
          url: http://auth:9999/.well-known/oauth-authorization-server
          routes:
            - name: well-known-oauth
              strip_path: true
              paths:
                - /.well-known/oauth-authorization-server
          plugins:
            - name: cors

        ## Analytics routes
        ## Not used - Studio and Vector talk directly to analytics via Docker networking.
        ## If external access is needed, add routes with key-auth matching Logflare's x-api-key auth.
        # - name: analytics-v1-api
        #   _comment: 'Analytics: /analytics/v1/api/endpoints/* -> http://logflare:4000/api/endpoints/*'
        #   url: http://analytics:4000/api/endpoints
        #   routes:
        #     - name: analytics-v1-api
        #       strip_path: true
        #       paths:
        #         - /analytics/v1/api/endpoints/
        # - name: analytics-v1
        #   _comment: 'Analytics: /analytics/v1/* -> http://logflare:4000/*'
        #   url: http://analytics:4000/
        #   routes:
        #     - name: dashboard-v1-all
        #       strip_path: true
        #       paths:
        #         - /analytics/v1
        #   plugins:
        #     - name: cors
        #     - name: basic-auth
        #       config:
        #         hide_credentials: true

        ## Secure Database routes
        - name: meta
          _comment: 'pg-meta: /pg/* -> http://pg-meta:8080/*'
          url: http://meta:8080/
          routes:
            - name: meta-all
              strip_path: true
              paths:
                - /pg/
          plugins:
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin

        ## Block access to /api/mcp
        - name: mcp-blocker
          _comment: 'Block direct access to /api/mcp'
          url: http://studio:3000/api/mcp
          routes:
            - name: mcp-blocker-route
              strip_path: true
              paths:
                - /api/mcp
          plugins:
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."

        ## MCP endpoint - local access
        - name: mcp
          _comment: 'MCP: /mcp -> http://studio:3000/api/mcp (local access)'
          url: http://studio:3000/api/mcp
          routes:
            - name: mcp
              strip_path: true
              paths:
                - /mcp
          plugins:
            # Block access to /mcp by default
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."
            # Enable local access (danger zone!)
            # 1. Comment out the 'request-termination' section above
            # 2. Uncomment the entire section below, including 'deny'
            # 3. Add your local IPs to the 'allow' list
            #- name: cors
            #- name: ip-restriction
            #  config:
            #    allow:
            #      - 127.0.0.1
            #      - ::1
            #    deny: []

        ## Protected Dashboard - catch all remaining routes
        - name: dashboard
          _comment: 'Studio: /* -> http://studio:3000/*'
          url: http://studio:3000/
          routes:
            - name: dashboard-all
              strip_path: true
              paths:
                - /
          plugins:
            - name: cors
            - name: basic-auth
              config:
                hide_credentials: true

  kong_entrypoint:
    content: |
      #!/bin/sh
      # Custom entrypoint for Kong that builds Lua expressions for request-transformer
      # and performs environment variable substitution in the declarative config.

      # Build Lua expressions for translating opaque API keys to asymmetric JWTs.
      # When opaque keys are not configured (empty env vars), expressions fall through
      # to legacy-only behavior - just passing apikey as-is.
      #
      # Full expression logic (when opaque keys are configured):
      #   1. If Authorization header exists and is NOT an sb_ key -> pass through (user session JWT)
      #   2. If apikey matches secret key -> set service_role asymmetric JWT internal "API key"
      #   3. If apikey matches publishable key -> set anon asymmetric JWT internal "API key"
      #   4. Fallback: pass apikey as-is (legacy HS256 JWT)

      if [ -n "$$SUPABASE_SECRET_KEY" ] && [ -n "$$SUPABASE_PUBLISHABLE_KEY" ]; then
          # Opaque keys configured -> full translation expressions
          export LUA_AUTH_EXPR="\$$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '$$SUPABASE_SECRET_KEY' and 'Bearer $$SERVICE_ROLE_KEY_ASYMMETRIC') or (headers.apikey == '$$SUPABASE_PUBLISHABLE_KEY' and 'Bearer $$ANON_KEY_ASYMMETRIC') or headers.apikey)"

          # Realtime WebSocket: reads from query_params.apikey (supabase-js sends apikey
          # via query string), outputs to x-api-key header which Realtime checks first.
          export LUA_RT_WS_EXPR="\$$((query_params.apikey == '$$SUPABASE_SECRET_KEY' and '$$SERVICE_ROLE_KEY_ASYMMETRIC') or (query_params.apikey == '$$SUPABASE_PUBLISHABLE_KEY' and '$$ANON_KEY_ASYMMETRIC') or query_params.apikey)"
      else
          # Legacy API keys, not sb_ API keys -> pass apikey through unchanged
          export LUA_AUTH_EXPR="\$$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or headers.apikey)"
          export LUA_RT_WS_EXPR="\$$(query_params.apikey)"
      fi

      # Substitute environment variables in the Kong declarative config.
      # Uses awk instead of eval/echo to preserve YAML quoting (eval strips double
      # quotes, breaking "Header: value" patterns that YAML parses as mappings).
      awk '{
        result = ""
        rest = $$0
        while (match(rest, /\$$[A-Za-z_][A-Za-z_0-9]*/)) {
          varname = substr(rest, RSTART + 1, RLENGTH - 1)
          if (varname in ENVIRON) {
            result = result substr(rest, 1, RSTART - 1) ENVIRON[varname]
          } else {
            result = result substr(rest, 1, RSTART + RLENGTH - 1)
          }
          rest = substr(rest, RSTART + RLENGTH)
        }
        print result rest
      }' /usr/local/kong/temp.yml > "$$KONG_DECLARATIVE_CONFIG"

      # Remove empty key-auth credentials (unconfigured opaque keys)
      sed -i '/^[[:space:]]*- key:[[:space:]]*$$/d' "$$KONG_DECLARATIVE_CONFIG"

      exec /entrypoint.sh kong docker-start

  vector_config:
    content: |
      api:
        enabled: true
        address: 0.0.0.0:9001

      sources:
        docker_host:
          type: docker_logs
          exclude_containers:
            - ${CONTAINER_PREFIX}-vector

      transforms:
        project_logs:
          type: remap
          inputs:
            - docker_host
          source: |-
            .project = "default"
            .event_message = del(.message)
            .appname = del(.container_name)
            del(.container_created_at)
            del(.container_id)
            del(.source_type)
            del(.stream)
            del(.label)
            del(.image)
            del(.host)
            del(.stream)
        router:
          type: route
          inputs:
            - project_logs
          route:
            kong: '.appname == "${CONTAINER_PREFIX}-kong"'
            auth: '.appname == "${CONTAINER_PREFIX}-auth"'
            rest: '.appname == "${CONTAINER_PREFIX}-rest"'
            realtime: '.appname == "realtime-dev.${CONTAINER_PREFIX}-realtime"'
            storage: '.appname == "${CONTAINER_PREFIX}-storage"'
            functions: '.appname == "${CONTAINER_PREFIX}-functions"'
            db: '.appname == "${CONTAINER_PREFIX}-db"'
        # Ignores non nginx errors since they are related with kong booting up
        kong_logs:
          type: remap
          inputs:
            - router.kong
          source: |-
            req, err = parse_nginx_log(.event_message, "combined")
            if err == null {
                .timestamp = req.timestamp
                .metadata.request.headers.referer = req.referer
                .metadata.request.headers.user_agent = req.agent
                .metadata.request.headers.cf_connecting_ip = req.client
                .metadata.response.status_code = req.status
                url, split_err = split(req.request, " ")
                if split_err == null {
                    .metadata.request.method = url[0]
                    .metadata.request.path = url[1]
                    .metadata.request.protocol = url[2]
                }
            }
            if err != null {
              abort
            }
        # Ignores non nginx errors since they are related with kong booting up
        kong_err:
          type: remap
          inputs:
            - router.kong
          source: |-
            .metadata.request.method = "GET"
            .metadata.response.status_code = 200
            parsed, err = parse_nginx_log(.event_message, "error")
            if err == null {
                .timestamp = parsed.timestamp
                .severity = parsed.severity
                .metadata.request.host = parsed.host
                .metadata.request.headers.cf_connecting_ip = parsed.client
                url, err = split(parsed.request, " ")
                if err == null {
                    .metadata.request.method = url[0]
                    .metadata.request.path = url[1]
                    .metadata.request.protocol = url[2]
                }
            }
            if err != null {
              abort
            }
        # Gotrue logs are structured json strings which frontend parses directly. But we keep metadata for consistency.
        auth_logs:
          type: remap
          inputs:
            - router.auth
          source: |-
            parsed, err = parse_json(.event_message)
            if err == null {
                .metadata.timestamp = parsed.time
                .metadata = merge!(.metadata, parsed)
            }
        # PostgREST logs are structured so we separate timestamp from message using regex
        rest_logs:
          type: remap
          inputs:
            - router.rest
          source: |-
            parsed, err = parse_regex(.event_message, r'^(?P<time>.*): (?P<msg>.*)$$')
            if err == null {
                .event_message = parsed.msg
                .timestamp = parse_timestamp!(value: parsed.time,format: "%d/%b/%Y:%H:%M:%S %z")
                .metadata.host = .project
            }
        # Filter out healthcheck logs from Realtime
        realtime_logs_filtered:
          type: filter
          inputs:
            - router.realtime
          condition: '!contains(string!(.event_message), "/health")'
        # Realtime logs are structured so we parse the severity level using regex (ignore time because it has no date)
        realtime_logs:
          type: remap
          inputs:
            - realtime_logs_filtered
          source: |-
            .metadata.project = del(.project)
            .metadata.external_id = .metadata.project
            parsed, err = parse_regex(.event_message, r'^(?P<time>\d+:\d+:\d+\.\d+) \[(?P<level>\w+)\] (?P<msg>.*)$$')
            if err == null {
                .event_message = parsed.msg
                .metadata.level = parsed.level
            }
        # Function logs are unstructured messages on stderr
        functions_logs:
          type: remap
          inputs:
            - router.functions
          source: |-
            .metadata.project_ref = del(.project)
        # Storage logs may contain json objects so we parse them for completeness
        storage_logs:
          type: remap
          inputs:
            - router.storage
          source: |-
            .metadata.project = del(.project)
            .metadata.tenantId = .metadata.project
            parsed, err = parse_json(.event_message)
            if err == null {
                .event_message = parsed.msg
                .metadata.level = parsed.level
                .metadata.timestamp = parsed.time
                .metadata.context[0].host = parsed.hostname
                .metadata.context[0].pid = parsed.pid
            }
        # Postgres logs some messages to stderr which we map to warning severity level
        db_logs:
          type: remap
          inputs:
            - router.db
          source: |-
            .metadata.host = "db-default"
            .metadata.parsed.timestamp = .timestamp

            parsed, err = parse_regex(.event_message, r'.*(?P<level>INFO|NOTICE|WARNING|ERROR|LOG|FATAL|PANIC?):.*', numeric_groups: true)

            if err != null || parsed == null {
              .metadata.parsed.error_severity = "info"
            }
            if parsed.level != null {
             .metadata.parsed.error_severity = parsed.level
            }
            if .metadata.parsed.error_severity == "info" {
                .metadata.parsed.error_severity = "log"
            }
            .metadata.parsed.error_severity = upcase!(.metadata.parsed.error_severity)

      sinks:
        logflare_auth:
          type: 'http'
          inputs:
            - auth_logs
          encoding:
            codec: 'json'
          method: 'post'
          request:
            retry_max_duration_secs: 30
            retry_initial_backoff_secs: 1
            headers:
              x-api-key: $${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
          uri: 'http://analytics:4000/api/logs?source_name=gotrue.logs.prod'
        logflare_realtime:
          type: 'http'
          inputs:
            - realtime_logs
          encoding:
            codec: 'json'
          method: 'post'
          request:
            retry_max_duration_secs: 30
            retry_initial_backoff_secs: 1
            headers:
              x-api-key: $${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
          uri: 'http://analytics:4000/api/logs?source_name=realtime.logs.prod'
        logflare_rest:
          type: 'http'
          inputs:
            - rest_logs
          encoding:
            codec: 'json'
          method: 'post'
          request:
            retry_max_duration_secs: 30
            retry_initial_backoff_secs: 1
            headers:
              x-api-key: $${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
          uri: 'http://analytics:4000/api/logs?source_name=postgREST.logs.prod'
        logflare_db:
          type: 'http'
          inputs:
            - db_logs
          encoding:
            codec: 'json'
          method: 'post'
          request:
            retry_max_duration_secs: 30
            retry_initial_backoff_secs: 1
            headers:
              x-api-key: $${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
          # Route directly to analytics like other sinks. Retry handles the startup
          # race where analytics may not be ready yet when early DB logs arrive.
          uri: 'http://analytics:4000/api/logs?source_name=postgres.logs'
        logflare_functions:
          type: 'http'
          inputs:
            - functions_logs
          encoding:
            codec: 'json'
          method: 'post'
          request:
            retry_max_duration_secs: 30
            retry_initial_backoff_secs: 1
            headers:
              x-api-key: $${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
          uri: 'http://analytics:4000/api/logs?source_name=deno-relay-logs'
        logflare_storage:
          type: 'http'
          inputs:
            - storage_logs
          encoding:
            codec: 'json'
          method: 'post'
          request:
            retry_max_duration_secs: 30
            retry_initial_backoff_secs: 1
            headers:
              x-api-key: $${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
          uri: 'http://analytics:4000/api/logs?source_name=storage.logs.prod.2'
        logflare_kong:
          type: 'http'
          inputs:
            - kong_logs
            - kong_err
          encoding:
            codec: 'json'
          method: 'post'
          request:
            retry_max_duration_secs: 30
            retry_initial_backoff_secs: 1
            headers:
              x-api-key: $${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
          uri: 'http://analytics:4000/api/logs?source_name=cloudflare.logs.prod'
        logflare_unmatched:
          type: 'blackhole'
          inputs:
            - router._unmatched
          print_interval_secs: 0

  db_supabase_sql:
    content: |
      \set pguser `echo "$$POSTGRES_USER"`

      CREATE DATABASE _supabase WITH OWNER :pguser;

  db_realtime_sql:
    content: |
      \set pguser `echo "$$POSTGRES_USER"`

      create schema if not exists _realtime;
      alter schema _realtime owner to :pguser;

  db_logs_sql:
    content: |
      \set pguser `echo "$$POSTGRES_USER"`

      \c _supabase
      create schema if not exists _analytics;
      alter schema _analytics owner to :pguser;
      \c postgres

  db_pooler_sql:
    content: |
      \set pguser `echo "$$POSTGRES_USER"`

      \c _supabase
      create schema if not exists _supavisor;
      alter schema _supavisor owner to :pguser;
      \c postgres

  db_webhooks_sql:
    content: |
      BEGIN;
        -- Create pg_net extension
        CREATE EXTENSION IF NOT EXISTS pg_net SCHEMA extensions;
        -- Create supabase_functions schema
        CREATE SCHEMA supabase_functions AUTHORIZATION supabase_admin;
        GRANT USAGE ON SCHEMA supabase_functions TO postgres, anon, authenticated, service_role;
        ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
        ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
        ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;
        -- supabase_functions.migrations definition
        CREATE TABLE supabase_functions.migrations (
          version text PRIMARY KEY,
          inserted_at timestamptz NOT NULL DEFAULT NOW()
        );
        -- Initial supabase_functions migration
        INSERT INTO supabase_functions.migrations (version) VALUES ('initial');
        -- supabase_functions.hooks definition
        CREATE TABLE supabase_functions.hooks (
          id bigserial PRIMARY KEY,
          hook_table_id integer NOT NULL,
          hook_name text NOT NULL,
          created_at timestamptz NOT NULL DEFAULT NOW(),
          request_id bigint
        );
        CREATE INDEX supabase_functions_hooks_request_id_idx ON supabase_functions.hooks USING btree (request_id);
        CREATE INDEX supabase_functions_hooks_h_table_id_h_name_idx ON supabase_functions.hooks USING btree (hook_table_id, hook_name);
        COMMENT ON TABLE supabase_functions.hooks IS 'Supabase Functions Hooks: Audit trail for triggered hooks.';
        CREATE FUNCTION supabase_functions.http_request()
          RETURNS trigger
          LANGUAGE plpgsql
          AS $$function$$
          DECLARE
            request_id bigint;
            payload jsonb;
            url text := TG_ARGV[0]::text;
            method text := TG_ARGV[1]::text;
            headers jsonb DEFAULT '{}'::jsonb;
            params jsonb DEFAULT '{}'::jsonb;
            timeout_ms integer DEFAULT 1000;
          BEGIN
            IF url IS NULL OR url = 'null' THEN
              RAISE EXCEPTION 'url argument is missing';
            END IF;

            IF method IS NULL OR method = 'null' THEN
              RAISE EXCEPTION 'method argument is missing';
            END IF;

            IF TG_ARGV[2] IS NULL OR TG_ARGV[2] = 'null' THEN
              headers = '{"Content-Type": "application/json"}'::jsonb;
            ELSE
              headers = TG_ARGV[2]::jsonb;
            END IF;

            IF TG_ARGV[3] IS NULL OR TG_ARGV[3] = 'null' THEN
              params = '{}'::jsonb;
            ELSE
              params = TG_ARGV[3]::jsonb;
            END IF;

            IF TG_ARGV[4] IS NULL OR TG_ARGV[4] = 'null' THEN
              timeout_ms = 1000;
            ELSE
              timeout_ms = TG_ARGV[4]::integer;
            END IF;

            CASE
              WHEN method = 'GET' THEN
                SELECT http_get INTO request_id FROM net.http_get(
                  url,
                  params,
                  headers,
                  timeout_ms
                );
              WHEN method = 'POST' THEN
                payload = jsonb_build_object(
                  'old_record', OLD,
                  'record', NEW,
                  'type', TG_OP,
                  'table', TG_TABLE_NAME,
                  'schema', TG_TABLE_SCHEMA
                );

                SELECT http_post INTO request_id FROM net.http_post(
                  url,
                  payload,
                  params,
                  headers,
                  timeout_ms
                );
              ELSE
                RAISE EXCEPTION 'method argument % is invalid', method;
            END CASE;

            INSERT INTO supabase_functions.hooks
              (hook_table_id, hook_name, request_id)
            VALUES
              (TG_RELID, TG_NAME, request_id);

            RETURN NEW;
          END
        $$function$$;
        -- Supabase super admin
        DO
        $$$$
        BEGIN
          IF NOT EXISTS (
            SELECT 1
            FROM pg_roles
            WHERE rolname = 'supabase_functions_admin'
          )
          THEN
            CREATE USER supabase_functions_admin NOINHERIT CREATEROLE LOGIN NOREPLICATION;
          END IF;
        END
        $$$$;
        GRANT ALL PRIVILEGES ON SCHEMA supabase_functions TO supabase_functions_admin;
        GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA supabase_functions TO supabase_functions_admin;
        GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA supabase_functions TO supabase_functions_admin;
        ALTER USER supabase_functions_admin SET search_path = "supabase_functions";
        ALTER table "supabase_functions".migrations OWNER TO supabase_functions_admin;
        ALTER table "supabase_functions".hooks OWNER TO supabase_functions_admin;
        ALTER function "supabase_functions".http_request() OWNER TO supabase_functions_admin;
        GRANT supabase_functions_admin TO postgres;
        -- Remove unused supabase_pg_net_admin role
        DO
        $$$$
        BEGIN
          IF EXISTS (
            SELECT 1
            FROM pg_roles
            WHERE rolname = 'supabase_pg_net_admin'
          )
          THEN
            REASSIGN OWNED BY supabase_pg_net_admin TO supabase_admin;
            DROP OWNED BY supabase_pg_net_admin;
            DROP ROLE supabase_pg_net_admin;
          END IF;
        END
        $$$$;
        -- pg_net grants when extension is already enabled
        DO
        $$$$
        BEGIN
          IF EXISTS (
            SELECT 1
            FROM pg_extension
            WHERE extname = 'pg_net'
          )
          THEN
            GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
            ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
            ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
            ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
            REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
            REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
            GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
          END IF;
        END
        $$$$;
        -- Event trigger for pg_net
        CREATE OR REPLACE FUNCTION extensions.grant_pg_net_access()
        RETURNS event_trigger
        LANGUAGE plpgsql
        AS $$$$
        BEGIN
          IF EXISTS (
            SELECT 1
            FROM pg_event_trigger_ddl_commands() AS ev
            JOIN pg_extension AS ext
            ON ev.objid = ext.oid
            WHERE ext.extname = 'pg_net'
          )
          THEN
            GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
            ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
            ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
            ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
            REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
            REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
            GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
          END IF;
        END;
        $$$$;
        COMMENT ON FUNCTION extensions.grant_pg_net_access IS 'Grants access to pg_net';
        DO
        $$$$
        BEGIN
          IF NOT EXISTS (
            SELECT 1
            FROM pg_event_trigger
            WHERE evtname = 'issue_pg_net_access'
          ) THEN
            CREATE EVENT TRIGGER issue_pg_net_access ON ddl_command_end WHEN TAG IN ('CREATE EXTENSION')
            EXECUTE PROCEDURE extensions.grant_pg_net_access();
          END IF;
        END
        $$$$;
        INSERT INTO supabase_functions.migrations (version) VALUES ('20210809183423_update_grants');
        ALTER function supabase_functions.http_request() SECURITY DEFINER;
        ALTER function supabase_functions.http_request() SET search_path = supabase_functions;
        REVOKE ALL ON FUNCTION supabase_functions.http_request() FROM PUBLIC;
        GRANT EXECUTE ON FUNCTION supabase_functions.http_request() TO postgres, anon, authenticated, service_role;
      COMMIT;

  db_roles_sql:
    content: |
      -- NOTE: change to your own passwords for production environments
      \set pgpass `echo "$$POSTGRES_PASSWORD"`

      ALTER USER authenticator WITH PASSWORD :'pgpass';
      ALTER USER pgbouncer WITH PASSWORD :'pgpass';
      ALTER USER supabase_auth_admin WITH PASSWORD :'pgpass';
      ALTER USER supabase_functions_admin WITH PASSWORD :'pgpass';
      ALTER USER supabase_storage_admin WITH PASSWORD :'pgpass';

  # SECURITY: only the (non-secret) JWT expiry is stored as a database setting.
  # The JWT signing secret used to be written here as app.settings.jwt_secret,
  # which any database role could read with current_setting() and use to mint
  # service_role tokens (supabase/supabase#43513, fixed upstream in #45003).
  # Existing databases are cleaned up by the db-jwt-reset one-shot service below.
  db_jwt_sql:
    content: |
      \set jwt_exp `echo "$$JWT_EXP"`

      ALTER DATABASE postgres SET "app.settings.jwt_exp" TO :'jwt_exp';

  functions_main_index:
    content: |
      import * as jose from 'jsr:@panva/jose@6'

      console.log('main function started')

      const JWT_SECRET = Deno.env.get('JWT_SECRET')
      const SUPABASE_JWKS = parseJwks(Deno.env.get('SUPABASE_JWKS'))
      const LOCAL_JWKS = SUPABASE_JWKS ? jose.createLocalJWKSet(SUPABASE_JWKS) : null
      const VERIFY_JWT = Deno.env.get('VERIFY_JWT') === 'true'

      type AuthFailure = {
        code: RequestErrors
        message?: string
      }

      export enum RequestErrors {
        InvalidLegacyJWT = 'UNAUTHORIZED_LEGACY_JWT',
        InvalidAsymmetricJWT = 'UNAUTHORIZED_ASYMMETRIC_JWT',
        InvalidTokenFormat = 'UNAUTHORIZED_INVALID_JWT_FORMAT',
        UnsupportedTokenAlgorithm = 'UNAUTHORIZED_UNSUPPORTED_TOKEN_ALGORITHM',
        MissingAuthHeader = 'UNAUTHORIZED_NO_AUTH_HEADER',
      }

      // NOTE:(kallebysantos) We don't check for valid keys but just the bare array parsing,
      // let this for 'jose' lib verification
      export function parseJwks(raw: string | undefined): jose.JSONWebKeySet | null {
        if (!raw) return null
        try {
          const parsed = JSON.parse(raw)
          if (parsed?.keys && Array.isArray(parsed.keys)) {
            return parsed as jose.JSONWebKeySet
          }
          return null
        } catch {
          return null
        }
      }

      /**
       * Extract JWT token from Authorization header
       *
       * Parses the Authorization header to extract the Bearer token.
       * Expects format: "Bearer <token>"
       *
       * @param req - The HTTP request object
       * @returns The JWT token string or an authentication failure
       */
      function getAuthToken(req: Request): string | AuthFailure {
        const authHeader = req.headers.get('authorization')
        if (!authHeader) {
          return {
            code: RequestErrors.MissingAuthHeader,
            message: 'Missing authorization header',
          }
        }
        const tokenParts = authHeader.trim().split(/\s+/)
        const [bearer, token] = tokenParts
        if (bearer.toLowerCase() !== 'bearer' || tokenParts.length !== 2 || !token) {
          return {
            code: RequestErrors.InvalidTokenFormat,
            message: 'Invalid JWT format',
          }
        }
        return token
      }

      function getAuthErrorResponse({ code, message = 'Invalid JWT' }: AuthFailure) {
        return Response.json(
          {
            code,
            message,
            // DEPRECATED: Retained for backward compatibility.
            msg: message,
          },
          {
            status: 401,
            headers: {
              'sb-error-code': code,
              'Access-Control-Expose-Headers': 'sb-error-code',
            },
          }
        )
      }

      async function isValidLegacyJWT(jwt: string): Promise<AuthFailure | null> {
        if (!JWT_SECRET) {
          console.error('JWT_SECRET not available for HS256 token verification')
          return { code: RequestErrors.InvalidLegacyJWT }
        }

        const encoder = new TextEncoder();
        const secretKey = encoder.encode(JWT_SECRET);

        try {
          await jose.jwtVerify(jwt, secretKey);
        } catch (e) {
          console.error('Symmetric Legacy JWT verification error', e);
          return { code: RequestErrors.InvalidLegacyJWT }
        }
        return null
      }

      async function isValidJWT(jwt: string): Promise<AuthFailure | null> {
        if (!LOCAL_JWKS) {
          console.error('JWKS not available for ES256/RS256 token verification')
          return { code: RequestErrors.InvalidAsymmetricJWT }
        }

        try {
          await jose.jwtVerify(jwt, LOCAL_JWKS);
        } catch (e) {
          console.error('Asymmetric JWT verification error', e);
          return { code: RequestErrors.InvalidAsymmetricJWT }
        }

        return null
      }

      /**
       * Verify JWT token, handling both legacy (HS256) and newer (ES256/RS256) algorithms
       * 
       * This function automatically detects the algorithm used in the token and applies
       * the appropriate verification method:
       * - HS256: Uses JWT_SECRET (symmetric key)
       * - ES256/RS256: Uses JWKS endpoint (asymmetric public keys)
       * 
       * This fix ensures compatibility with both legacy tokens and newer asymmetric tokens,
       * resolving the "Key for the ES256 algorithm must be of type CryptoKey" error.
       * 
       * @param jwt - The JWT token string to verify
       * @returns Authentication failure details, or null when verification succeeds
       */
      async function isValidHybridJWT(jwt: string): Promise<AuthFailure | null> {
        let jwtAlgorithm: string | undefined
        try {
          jwtAlgorithm = jose.decodeProtectedHeader(jwt).alg
        } catch (e) {
          console.error('JWT format error', e)
          return {
            code: RequestErrors.InvalidTokenFormat,
            message: 'Invalid JWT format',
          }
        }

        if (!jwtAlgorithm) {
          return {
            code: RequestErrors.InvalidTokenFormat,
            message: 'Invalid JWT format',
          }
        }

        if (jwtAlgorithm === 'HS256') {
          console.log(`Legacy token type detected, attempting $${jwtAlgorithm} verification.`)

          return await isValidLegacyJWT(jwt)
        }

        if (jwtAlgorithm === 'ES256' || jwtAlgorithm === 'RS256') {
          return await isValidJWT(jwt)
        }

        return {
          code: RequestErrors.UnsupportedTokenAlgorithm,
          message: `Unsupported JWT algorithm $${jwtAlgorithm}`,
        }
      }

      Deno.serve(async (req: Request) => {
        if (req.method !== 'OPTIONS' && VERIFY_JWT) {
          try {
            const token = getAuthToken(req)
            if (typeof token !== 'string') {
              return getAuthErrorResponse(token)
            }
            const authFailure = await isValidHybridJWT(token)
            if (authFailure) {
              return getAuthErrorResponse(authFailure)
            }
          } catch (e) {
            console.error(e)
            return getAuthErrorResponse({
              code: RequestErrors.InvalidTokenFormat,
              message: 'Invalid JWT format',
            })
          }
        }

        const url = new URL(req.url)
        const { pathname } = url
        const path_parts = pathname.split('/')
        const service_name = path_parts[1]

        if (!service_name || service_name === '') {
          const error = { msg: 'missing function name in request' }
          return new Response(JSON.stringify(error), {
            status: 400,
            headers: { 'Content-Type': 'application/json' },
          })
        }

        const servicePath = `/home/deno/functions/$${service_name}`
        console.error(`serving the request with $${servicePath}`)

        const memoryLimitMb = parseInt(Deno.env.get('FUNCTIONS_WORKER_MEMORY_MB') || '512')
        const workerTimeoutMs = parseInt(Deno.env.get('FUNCTIONS_WORKER_TIMEOUT_MS') || '300000')
        const noModuleCache = false
        // Using a common Import Map for all functions 
        // to use a scope 'deno.json' it must be dinamically resolved base on the 'service_name'
        const importMapPath = `/home/deno/functions/deno.jsonc`
        // SUPABASE_FUNCTION_SLUG is listed after the container env snapshot so
        // nothing in it can shadow the value, and it is per-request because only this
        // worker knows which function the request resolved to.
        const envVarsObj = { ...Deno.env.toObject(), SUPABASE_FUNCTION_SLUG: service_name }
        const envVars = Object.keys(envVarsObj).map((k) => [k, envVarsObj[k]])

        try {
          const worker = await EdgeRuntime.userWorkers.create({
            servicePath,
            memoryLimitMb,
            workerTimeoutMs,
            noModuleCache,
            importMapPath,
            envVars,
          })
          return await worker.fetch(req)
        } catch (e) {
          const error = { msg: e.toString() }
          return new Response(JSON.stringify(error), {
            status: 500,
            headers: { 'Content-Type': 'application/json' },
          })
        }
      })

  functions_deno_jsonc:
    content: |
      {
        "imports": {
          "@supabase/functions-js": "jsr:@supabase/functions-js@^2",
          "@supabase/server": "npm:@supabase/server@^1"
        }
      }

  functions_hello_index:
    content: |
      Deno.serve(async () => {
        return new Response(
          `"Hello from Edge Functions!"`,
          { headers: { "Content-Type": "application/json" } },
        )
      })

  pooler_config:
    content: |
      {:ok, _} = Application.ensure_all_started(:supavisor)

      {:ok, version} =
        case Supavisor.Repo.query!("select version()") do
          %{rows: [[ver]]} -> Supavisor.Helpers.parse_pg_version(ver)
          _ -> nil
        end

      params = %{
        "external_id" => System.get_env("POOLER_TENANT_ID"),
        "db_host" => System.get_env("POSTGRES_HOST") || "db",
        "db_port" => System.get_env("POSTGRES_PORT"),
        "db_database" => System.get_env("POSTGRES_DB"),
        "require_user" => false,
        "auth_query" => "SELECT * FROM pgbouncer.get_auth($$1)",
        "default_max_clients" => System.get_env("POOLER_MAX_CLIENT_CONN"),
        "default_pool_size" => System.get_env("POOLER_DEFAULT_POOL_SIZE"),
        "client_idle_timeout" => String.to_integer(System.get_env("POOLER_CLIENT_IDLE_TIMEOUT", "0")),
        "client_heartbeat_interval" => String.to_integer(System.get_env("POOLER_CLIENT_HEARTBEAT_INTERVAL", "60")),
        "default_parameter_status" => %{"server_version" => version},
        "users" => [%{
          "db_user" => "pgbouncer",
          "db_password" => System.get_env("POSTGRES_PASSWORD"),
          "mode_type" => System.get_env("POOLER_POOL_MODE"),
          "pool_size" => System.get_env("POOLER_DEFAULT_POOL_SIZE"),
          "pool_checkout_timeout" => String.to_integer(System.get_env("POOLER_POOL_CHECKOUT_TIMEOUT", "60000")),
          "is_manager" => true
        }]
      }

      if !Supavisor.Tenants.get_tenant_by_external_id(params["external_id"]) do
        {:ok, _} = Supavisor.Tenants.create_tenant(params)
      end

services:

  studio:
    container_name: ${CONTAINER_PREFIX}-studio
    image: supabase/studio:2026.09.07-sha-7996410
    restart: unless-stopped
    volumes:
      - ../files/volumes/snippets:/app/snippets:Z
      - ../files/volumes/functions:/app/edge-functions:Z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""
        ]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    depends_on:
      analytics:
        condition: service_healthy
    environment:
      # Listen on all IPv4 interfaces
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}

      # Role Studio uses for SQL. Upstream default is the non-superuser `postgres`.
      # Existing deployments whose objects were created as supabase_admin must
      # either reassign ownership (see README "Upgrading an existing deployment")
      # or set STUDIO_DB_USER=supabase_admin to keep the old behaviour.
      # See: https://supabase.com/docs/guides/self-hosting/remove-superuser-access
      POSTGRES_USER_READ_WRITE: ${STUDIO_DB_USER:-postgres}

      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}

      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      # Optional new-style opaque API keys (sb_publishable_... / sb_secret_...)
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}

      # Logs & analytics (Logflare) are bundled in this template
      LOGFLARE_PRIVATE_ACCESS_TOKEN: ${LOGFLARE_PRIVATE_ACCESS_TOKEN}
      LOGFLARE_URL: http://analytics:4000
      ENABLED_FEATURES_LOGS_ALL: "true"

      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

  kong:
    container_name: ${CONTAINER_PREFIX}-kong
    image: kong/kong:3.9.3
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # ports:
    #   - ${KONG_HTTP_PORT}:8000/tcp
    #   - ${KONG_HTTPS_PORT}:8443/tcp
    expose:
      - 8000
      - 8443
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    configs:
      - source: kong_config
        target: /usr/local/kong/temp.yml
      - source: kong_entrypoint
        target: /usr/local/kong/kong-entrypoint.sh
    depends_on:
      analytics:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      # `expressions` is required for the /rest/v1/ OpenAPI root route
      KONG_ROUTER_FLAVOR: expressions
      # https://github.com/supabase/cli/issues/14
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      # Optional new-style API keys; leave blank to use ANON_KEY/SERVICE_ROLE_KEY only
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      ANON_KEY_ASYMMETRIC: ${ANON_KEY_ASYMMETRIC:-}
      SERVICE_ROLE_KEY_ASYMMETRIC: ${SERVICE_ROLE_KEY_ASYMMETRIC:-}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    # kong 3.9 runs as non-root (uid 1001) and has no /home/kong, so the template
    # and the entrypoint live in /usr/local/kong (writable). The entrypoint does
    # the env substitution with awk (preserves YAML quoting) and builds the Lua
    # expressions used by the request-transformer plugin.
    entrypoint: ["/bin/sh", "/usr/local/kong/kong-entrypoint.sh"]
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

  auth:
    container_name: ${CONTAINER_PREFIX}-auth
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      # the next line seems required if you want to be able to send mails from the supabase GUI
      GOTRUE_MAILER_EXTERNAL_HOSTS: kong,${SUPABASE_HOST}
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_DB_MAX_POOL_SIZE: ${GOTRUE_DB_POOL:-15}

      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      # `iss` claim of issued tokens; API_EXTERNAL_URL should end with /auth/v1
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}

      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}

      # Uncomment to bypass nonce check in ID Token flow. Commonly set to true when using Google Sign In on mobile.
      # GOTRUE_EXTERNAL_SKIP_NONCE_CHECK: true

      # GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: true
      # GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}

      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

  rest:
    container_name: ${CONTAINER_PREFIX}-rest
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
      analytics:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "postgrest", "--ready" ]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      # SECURITY: PGRST_APP_SETTINGS_JWT_SECRET is intentionally NOT set. It made
      # PostgREST run `SET LOCAL app.settings.jwt_secret` on every request, which
      # exposed the signing secret to any SQL function (supabase/supabase#43513).
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
      PGRST_DB_POOL: ${PGRST_DB_POOL:-15}
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: ${PGRST_DB_POOL_TIMEOUT:-10}
    command: ["postgrest"]
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

  realtime:
    # This container name looks inconsistent but is correct because realtime constructs tenant id by parsing the subdomain
    container_name: realtime-dev.${CONTAINER_PREFIX}-realtime
    image: supabase/realtime:v2.134.10
    restart: unless-stopped
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
      analytics:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"
        ]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      # Realtime scaling
      TENANT_MAX_CONCURRENT_USERS: ${RT_MAX_CONCURRENT_USERS:-1000}
      TENANT_MAX_EVENTS_PER_SECOND: ${RT_MAX_EVENTS_PER_SECOND:-2500}
      TENANT_MAX_JOINS_PER_SECOND: ${RT_MAX_JOINS_PER_SECOND:-500}
      TENANT_MAX_BYTES_PER_SECOND: ${RT_MAX_BYTES_PER_SECOND:-500000}
      DISABLE_HEALTHCHECK_LOGGING: "true"
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

  # To use S3 backed storage: docker compose -f docker-compose.yml -f docker-compose.s3.yml up
  storage:
    container_name: ${CONTAINER_PREFIX}-storage
    image: supabase/storage-api:v1.74.0
    restart: unless-stopped
    volumes:
      - ../files/volumes/storage:/var/lib/storage:z
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://storage:5000/status"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-52428800}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      # Bucket name when using an S3 backend, directory name when using 'file'
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:-stub}
      TENANT_ID: ${STORAGE_TENANT_ID:-stub}
      # TODO: https://github.com/supabase/storage-api/issues/55
      REGION: ${REGION:-stub}
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
      # Credentials for the S3-compatible endpoint at /storage/v1/s3
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

  imgproxy:
    container_name: ${CONTAINER_PREFIX}-imgproxy
    image: darthsim/imgproxy:v3.31.4
    restart: unless-stopped
    volumes:
      - ../files/volumes/storage:/var/lib/storage:z
    healthcheck:
      test:
        [
          "CMD",
          "imgproxy",
          "health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: ${IMGPROXY_AUTO_WEBP:-true}
      IMGPROXY_MAX_SRC_RESOLUTION: "16.8"
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

  meta:
    container_name: ${CONTAINER_PREFIX}-meta
    image: supabase/postgres-meta:v0.99.0
    restart: unless-stopped
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      # See POSTGRES_USER_READ_WRITE on the studio service
      PG_META_DB_USER: ${STUDIO_DB_USER:-postgres}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

  analytics:
    container_name: ${CONTAINER_PREFIX}-analytics
    image: supabase/logflare:1.50.10
    restart: unless-stopped
    # ports:
    #   - 4000:4000
    expose:
      - 4000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sSfL -o /dev/null http://localhost:4000/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
    environment:
      LOGFLARE_NODE_HOST: 127.0.0.1
      DB_USERNAME: supabase_admin
      DB_DATABASE: _supabase
      DB_HOSTNAME: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SCHEMA: _analytics
      LOGFLARE_PUBLIC_ACCESS_TOKEN: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
      LOGFLARE_PRIVATE_ACCESS_TOKEN: ${LOGFLARE_PRIVATE_ACCESS_TOKEN}
      LOGFLARE_SINGLE_TENANT: true
      LOGFLARE_SUPABASE_MODE: true

      # Comment variables to use Big Query backend for analytics
      POSTGRES_BACKEND_URL: postgresql://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/_supabase
      POSTGRES_BACKEND_SCHEMA: _analytics
      LOGFLARE_FEATURE_FLAG_OVERRIDE: multibackend=true
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

  # One-shot init: copies image default config files to the bind mount on first deploy.
  # Required because bind mounts hide the image's /etc/postgresql-custom/ files
  # (unlike named volumes which auto-copy on first use).
  db-init:
    container_name: ${CONTAINER_PREFIX}-db-init
    image: supabase/postgres:17.6.1.136
    restart: "no"
    volumes:
      - ../files/volumes/db/config:/mnt/db-config:Z
    environment:
      SUPABASE_HOST: ${SUPABASE_HOST}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /mnt/db-config 2>/dev/null)" ]; then
          echo "First run: populating db config from image defaults..."
          cp -a /etc/postgresql-custom/* /mnt/db-config/
          chown -R postgres:postgres /mnt/db-config/
          echo "Done."
        else
          echo "Config directory already populated, skipping."
        fi
        # Generate a self-signed TLS cert so Postgres can serve ssl=on connections.
        # Persisted in the config bind mount; clients connect with sslmode=require.
        # NOTE: the supabase/postgres image is Nix-based — openssl is NOT on PATH,
        # it lives under /nix/store/*openssl*-bin/. Resolve it dynamically so this
        # survives image version bumps (the store hash changes per version).
        if [ ! -f /mnt/db-config/server.crt ] || [ ! -f /mnt/db-config/server.key ]; then
          echo "Generating self-signed TLS cert for Postgres..."
          OPENSSL="$$(ls /nix/store/*openssl*-bin/bin/openssl 2>/dev/null | head -1)"
          if [ -z "$$OPENSSL" ]; then
            echo "FATAL: openssl not found in image — cannot generate TLS cert" >&2
            exit 1
          fi
          "$$OPENSSL" req -new -x509 -days 3650 -nodes -text \
            -subj "/CN=$${SUPABASE_HOST}" \
            -out /mnt/db-config/server.crt \
            -keyout /mnt/db-config/server.key || { echo "FATAL: cert generation failed" >&2; exit 1; }
          chown postgres:postgres /mnt/db-config/server.key /mnt/db-config/server.crt
          chmod 600 /mnt/db-config/server.key
          chmod 644 /mnt/db-config/server.crt
          echo "Cert generated: $$(ls -l /mnt/db-config/server.crt /mnt/db-config/server.key)"
        else
          echo "TLS cert already present, skipping."
        fi

  # Comment out everything below this point if you are using an external Postgres database
  db:
    container_name: ${CONTAINER_PREFIX}-db
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    shm_size: ${PG_SHM_SIZE:-8g}
    ports:
      - ${POSTGRES_DIRECT_PORT:-5435}:${POSTGRES_PORT}
    networks:
      - default
      - dokploy-network
    configs:
      - source: db_realtime_sql
        target: /docker-entrypoint-initdb.d/migrations/99-realtime.sql
      - source: db_webhooks_sql
        target: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
      - source: db_roles_sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
      - source: db_jwt_sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
      - source: db_supabase_sql
        target: /docker-entrypoint-initdb.d/migrations/97-_supabase.sql
      - source: db_logs_sql
        target: /docker-entrypoint-initdb.d/migrations/99-logs.sql
      - source: db_pooler_sql
        target: /docker-entrypoint-initdb.d/migrations/99-pooler.sql
    volumes:
      # PGDATA directory is persisted between restarts
      - ../files/volumes/db/data:/var/lib/postgresql/data:Z
      # Persist pgsodium decryption key between restarts (bind mount, not named volume)
      - ../files/volumes/db/config:/etc/postgresql-custom:Z
    healthcheck:
      test:
        [
        "CMD",
        "pg_isready",
        "-U",
        "postgres",
        "-h",
        "localhost"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      db-init:
        condition: service_completed_successfully
      vector:
        condition: service_healthy
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_EXP: ${JWT_EXPIRY}
    command: [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal",
        # ── Memory ──
        "-c",
        "shared_buffers=${PG_SHARED_BUFFERS:-8GB}",
        "-c",
        "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-18GB}",
        "-c",
        "work_mem=${PG_WORK_MEM:-16MB}",
        "-c",
        "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-1536MB}",
        "-c",
        "autovacuum_work_mem=${PG_AUTOVACUUM_WORK_MEM:-256MB}",
        # ── WAL & Checkpoints ──
        "-c",
        "wal_buffers=${PG_WAL_BUFFERS:-16MB}",
        "-c",
        "checkpoint_completion_target=${PG_CHECKPOINT_COMPLETION:-0.9}",
        "-c",
        "min_wal_size=${PG_MIN_WAL_SIZE:-2GB}",
        "-c",
        "max_wal_size=${PG_MAX_WAL_SIZE:-8GB}",
        # ── NVMe SSD Optimization ──
        "-c",
        "random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}",
        "-c",
        "effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-200}",
        "-c",
        "maintenance_io_concurrency=${PG_MAINTENANCE_IO_CONCURRENCY:-200}",
        # ── Connections ──
        "-c",
        "max_connections=${PG_MAX_CONNECTIONS:-200}",
        # ── Parallelism (tuned for 8 vCPU) ──
        "-c",
        "max_worker_processes=${PG_MAX_WORKER_PROCESSES:-8}",
        "-c",
        "max_parallel_workers=${PG_MAX_PARALLEL_WORKERS:-8}",
        "-c",
        "max_parallel_workers_per_gather=${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-4}",
        "-c",
        "max_parallel_maintenance_workers=${PG_MAX_PARALLEL_MAINTENANCE_WORKERS:-4}",
        # ── Misc ──
        "-c",
        "huge_pages=${PG_HUGE_PAGES:-try}",
        "-c",
        "default_statistics_target=${PG_DEFAULT_STATISTICS_TARGET:-100}",
        # ── TLS / SSL (self-signed cert generated by db-init; clients use sslmode=require) ──
        "-c",
        "ssl=on",
        "-c",
        "ssl_cert_file=/etc/postgresql-custom/server.crt",
        "-c",
        "ssl_key_file=/etc/postgresql-custom/server.key",
      ]
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

  # One-shot migration: databases initialised by older versions of this template
  # have the JWT signing secret stored as the database setting
  # app.settings.jwt_secret, readable by every role (supabase/supabase#43513).
  # This removes it. Safe to run on every deploy — a no-op once it is gone.
  db-jwt-reset:
    container_name: ${CONTAINER_PREFIX}-db-jwt-reset
    image: supabase/postgres:17.6.1.136
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: ${POSTGRES_HOST}
      PGPORT: ${POSTGRES_PORT}
      # supabase_admin is the image superuser; `postgres` may not reset custom GUCs
      PGUSER: supabase_admin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        psql -v ON_ERROR_STOP=1 -tA <<'SQL'
        ALTER DATABASE postgres RESET "app.settings.jwt_secret";
        ALTER DATABASE :"DBNAME" RESET "app.settings.jwt_secret";
        SELECT CASE
          WHEN EXISTS (SELECT 1 FROM pg_db_role_setting, unnest(setconfig) AS c
                       WHERE c LIKE 'app.settings.jwt_secret=%')
          THEN 'ERROR: app.settings.jwt_secret is still set'
          ELSE 'OK: app.settings.jwt_secret is not stored in the database'
        END;
        SQL

  vector:
    container_name: ${CONTAINER_PREFIX}-vector
    image: timberio/vector:0.53.0-alpine
    restart: unless-stopped
    configs:
      - source: vector_config
        target: /etc/vector/vector.yml
    volumes:
      - ${DOCKER_SOCKET_LOCATION}:/var/run/docker.sock:ro,z
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://vector:9001/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      LOGFLARE_PUBLIC_ACCESS_TOKEN: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
    command:
      [
        "--config",
        "/etc/vector/vector.yml"
      ]
    security_opt:
      - "label=disable"
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

  # One-shot init: seeds the edge functions bind mount on first deploy with the
  # upstream main worker (JWT verification, hybrid HS256/ES256), the shared
  # deno.jsonc import map and a hello example. Existing files are never touched.
  functions-init:
    container_name: ${CONTAINER_PREFIX}-functions-init
    image: alpine:3.19
    restart: "no"
    volumes:
      - ../files/volumes/functions:/home/deno/functions:Z
    configs:
      - source: functions_main_index
        target: /seed/main/index.ts
      - source: functions_deno_jsonc
        target: /seed/deno.jsonc
      - source: functions_hello_index
        target: /seed/hello/index.ts
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in main/index.ts deno.jsonc hello/index.ts; do
          if [ ! -f "/home/deno/functions/$$f" ]; then
            echo "Seeding /home/deno/functions/$$f"
            mkdir -p "$$(dirname "/home/deno/functions/$$f")"
            cp "/seed/$$f" "/home/deno/functions/$$f"
          else
            echo "/home/deno/functions/$$f already exists, skipping."
          fi
        done
        echo "Done."

  functions:
    container_name: ${CONTAINER_PREFIX}-functions
    image: supabase/edge-runtime:v1.76.2
    restart: unless-stopped
    volumes:
      - ../files/volumes/functions:/home/deno/functions:Z
      - deno-cache:/root/.cache/deno
    env_file:
      - path: ../files/.env.functions
        required: false
    depends_on:
      analytics:
        condition: service_healthy
      kong:
        condition: service_healthy
      functions-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      # Legacy symmetric HS256 key
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      # Legacy API keys (HS256-signed JWTs)
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # New opaque API keys (optional)
      SUPABASE_PUBLISHABLE_KEYS: "{\"default\":\"${SUPABASE_PUBLISHABLE_KEY:-}\"}"
      SUPABASE_SECRET_KEYS: "{\"default\":\"${SUPABASE_SECRET_KEY:-}\"}"
      SUPABASE_DB_URL: postgresql://postgres.${POOLER_TENANT_ID}:${POSTGRES_PASSWORD}@supavisor:6543/${POSTGRES_DB}
      VERIFY_JWT: "${FUNCTIONS_VERIFY_JWT}"
      FUNCTIONS_WORKER_MEMORY_MB: "${FUNCTIONS_WORKER_MEMORY_MB:-512}"
      FUNCTIONS_WORKER_TIMEOUT_MS: "${FUNCTIONS_WORKER_TIMEOUT_MS:-300000}"
    command: ["start", "--main-service", "/home/deno/functions/main", "--policy", "per_worker"]
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

  # Update the DATABASE_URL if you are using an external Postgres database
  supavisor:
    container_name: ${CONTAINER_PREFIX}-pooler
    image: supabase/supavisor:2.9.12
    restart: unless-stopped
    ports:
      - ${POOLER_SESSION_PORT:-5432}:5432
      - ${POOLER_PROXY_PORT_TRANSACTION}:6543
    networks:
      - default
      - dokploy-network
    configs:
      - source: pooler_config
        target: /etc/pooler/pooler.exs
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sSfL",
          "--head",
          "-o",
          "/dev/null",
          "http://127.0.0.1:4000/api/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      PORT: 4000
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ecto://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/_supabase
      CLUSTER_POSTGRES: true
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      REGION: local
      ERL_AFLAGS: -proto_dist inet_tcp +K true +SDio 16 +sbwt none +sbwtdcpu none +sbwtdio none
      POOLER_TENANT_ID: ${POOLER_TENANT_ID}
      POOLER_DEFAULT_POOL_SIZE: ${POOLER_DEFAULT_POOL_SIZE}
      POOLER_MAX_CLIENT_CONN: ${POOLER_MAX_CLIENT_CONN}
      POOLER_POOL_MODE: transaction
      DB_POOL_SIZE: ${POOLER_DB_POOL_SIZE:-5}
    command:
      [
        "/bin/sh",
        "-c",
        "/app/bin/migrate && \
         echo 'Waiting for db role passwords (99-roles.sql) before seeding tenant...' && \
         until PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql \"host=db port=$$POSTGRES_PORT user=pgbouncer dbname=$$POSTGRES_DB\" -tAc 'SELECT 1' >/dev/null 2>&1; do \
           echo '  pgbouncer auth not ready yet, retrying in 2s...'; sleep 2; \
         done && \
         echo 'pgbouncer auth OK — seeding tenant.' && \
         /app/bin/supavisor eval \"$$(cat /etc/pooler/pooler.exs)\" && /app/bin/server"
      ]
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

volumes:
  # Deno module cache for edge functions (avoids re-downloading dependencies)
  deno-cache:

networks:
  dokploy-network:
    external: true
