# Trigger.dev External Databases (Dokploy Remote Server)
# ======================================================
# Standalone template: paste this compose + env file into Dokploy and deploy
# on a dedicated DB server (Dokploy remote server, NOT in Swarm).
#
# Services: postgres, redis, electric, clickhouse, minio, minio-init
# Deploy this FIRST, before the webapp compose.
#
# All services expose ports on the host. The webapp connects via DB_HOST:port.
# Firewall rules on this server MUST restrict access to the webapp server IP only.
# See server-setup-dbs.md for firewall configuration.

name: trigger-dbs

services:
  postgres:
    image: postgres:16
    container_name: ${CONTAINER_PREFIX}-postgres
    restart: unless-stopped
    shm_size: ${PG_SHM_SIZE:-8g}
    ports:
      - "5432:5432"
    command:
      - -c
      - wal_level=logical
      # ── Connections ──
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-1500}
      # ── Memory (tuned for 8 vCPU / 32GB RAM) ──
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-8GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-24GB}
      - -c
      # Increased for better sorting of 70+ task result sets
      - work_mem=${PG_WORK_MEM:-256MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-2GB}
      - -c
      - autovacuum_work_mem=${PG_AUTOVACUUM_WORK_MEM:-256MB}
      # ── WAL & Checkpoints ──
      - -c
      - wal_buffers=${PG_WAL_BUFFERS:-64MB}
      - -c
      - checkpoint_completion_target=${PG_CHECKPOINT_COMPLETION:-0.9}
      - -c
      - min_wal_size=${PG_MIN_WAL_SIZE:-1GB}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-4GB}
      - -c
      - checkpoint_timeout=${PG_CHECKPOINT_TIMEOUT:-15min}
      # ── NVMe SSD Optimization (Hetzner Cloud) ──
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-200}
      - -c
      - maintenance_io_concurrency=${PG_MAINTENANCE_IO_CONCURRENCY:-200}
      # ── Parallelism (tuned for 8 vCPU) ──
      - -c
      - max_worker_processes=${PG_MAX_WORKER_PROCESSES:-8}
      - -c
      - max_parallel_workers=${PG_MAX_PARALLEL_WORKERS:-8}
      - -c
      - max_parallel_workers_per_gather=${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-4}
      - -c
      - max_parallel_maintenance_workers=${PG_MAX_PARALLEL_MAINTENANCE_WORKERS:-4}
      # ── Misc ──
      - -c
      - default_statistics_target=${PG_DEFAULT_STATISTICS_TARGET:-100}
      - -c
      - huge_pages=${PG_HUGE_PAGES:-try}
      - -c
      - statement_timeout=${PG_STATEMENT_TIMEOUT:-30000}
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-trigger}"
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 20s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: "redis:7"
    container_name: ${CONTAINER_PREFIX}-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Optimized for 8 vCPU / 16GB RAM - tuned for shared server
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-12gb}
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
      --tcp-keepalive 300
      --tcp-backlog 511
      --timeout 0
      --io-threads ${REDIS_IO_THREADS:-6}
      --io-threads-do-reads yes
    volumes:
      - "redis-data:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  electric:
    image: "electricsql/electric:1.4.4"
    container_name: ${CONTAINER_PREFIX}-electric
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Uses intra-compose hostname (postgres) for internal communication
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trigger}?schema=public&sslmode=disable"
      ELECTRIC_SECRET: "${ELECTRIC_SECRET}"
      ELECTRIC_USAGE_REPORTING: "false"
      # Pool size budgeted for 8 vCPU / 16GB RAM (PG max_connections=550)
      ELECTRIC_DB_POOL_SIZE: 200

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  clickhouse:
    image: "clickhouse/clickhouse-server:25.8"
    container_name: ${CONTAINER_PREFIX}-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER:-default}
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    # Inline config creation - Optimized for 8 vCPU / 16GB RAM
    command:
      - /bin/bash
      - -c
      - |
        # Server settings (config.d) - NO profiles here
        cat > /etc/clickhouse-server/config.d/custom.xml << 'EOF'
        <clickhouse>
            <!-- Replace default listen_host (removes ::) with IPv4 only -->
            <listen_host replace="replace">0.0.0.0</listen_host>

            <!-- Logging: reduce noise -->
            <logger>
                <level>warning</level>
            </logger>

            <!-- Memory settings - capped at 30% RAM (shared 16GB server with PG, Redis, etc.) -->
            <mark_cache_size>1610612736</mark_cache_size> <!-- 1.5GB -->
            <uncompressed_cache_size>2147483648</uncompressed_cache_size> <!-- 2GB -->
            <max_server_memory_usage_to_ram_ratio>0.3</max_server_memory_usage_to_ram_ratio>

            <!-- Concurrency settings for 8 vCPU -->
            <max_concurrent_queries>300</max_concurrent_queries>
            <concurrent_threads_soft_limit_num>8</concurrent_threads_soft_limit_num>
            <background_pool_size>32</background_pool_size>
            <background_schedule_pool_size>32</background_schedule_pool_size>

            <merge_tree>
                <max_bytes_to_merge_at_max_space_in_pool>161061273600</max_bytes_to_merge_at_max_space_in_pool>
                <number_of_free_entries_in_pool_to_execute_mutation>20</number_of_free_entries_in_pool_to_execute_mutation>
                <!-- Aggressive merging to reduce FINAL query work -->
                <min_age_to_force_merge_seconds>3600</min_age_to_force_merge_seconds>
                <min_age_to_force_merge_on_partition_only>1</min_age_to_force_merge_on_partition_only>
            </merge_tree>

            <!-- Reduce log flush frequency -->
            <asynchronous_metric_log>
                <flush_interval_milliseconds>60000</flush_interval_milliseconds>
            </asynchronous_metric_log>
            <metric_log>
                <flush_interval_milliseconds>60000</flush_interval_milliseconds>
            </metric_log>
            <query_log>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </query_log>
        </clickhouse>
        EOF

        # User/profile settings (users.d) - profiles MUST be here to take effect
        cat > /etc/clickhouse-server/users.d/custom.xml << 'EOF'
        <clickhouse>
            <profiles>
                <default>
                    <max_threads>8</max_threads>
                    <max_block_size>65536</max_block_size>
                    <input_format_parallel_parsing>1</input_format_parallel_parsing>
                    <output_format_parallel_formatting>1</output_format_parallel_formatting>
                    <!-- FINAL query optimizations (7-30x faster for ReplacingMergeTree) -->
                    <do_not_merge_across_partitions_select_final>1</do_not_merge_across_partitions_select_final>
                    <max_final_threads>8</max_final_threads>
                    <optimize_move_to_prewhere_if_final>1</optimize_move_to_prewhere_if_final>
                </default>
            </profiles>
        </clickhouse>
        EOF
        exec /entrypoint.sh
    volumes:
      - "clickhouse-data:/var/lib/clickhouse"
      - "clickhouse-logs:/var/log/clickhouse-server"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ${CONTAINER_PREFIX}-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD}"
      MINIO_BROWSER: "on"
    volumes:
      - "minio-data:/data"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  minio-init:
    image: minio/mc:latest
    container_name: ${CONTAINER_PREFIX}-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - default
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
        mc mb --ignore-existing myminio/packets
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD}"

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
  clickhouse-logs:
  minio-data:

